// ─── Glassmorphism CSS ───
const css = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --bg-deep: #0C1220;
  --bg-surface: rgba(17,24,39,0.85);
  --glass-1: rgba(255,255,255,0.08);
  --glass-2: rgba(255,255,255,0.05);
  --glass-3: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.12);
  --glass-highlight: rgba(255,255,255,0.20);
  --glass-blur: 40px;
  --accent: #3B82F6;
  --accent-warm: #D4A574;
  --accent-glow: rgba(212,165,116,0.25);
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --purple: #8B5CF6;
  --text-1: #F1F5F9;
  --text-2: #94A3B8;
  --text-3: #64748B;
  --border: rgba(255,255,255,0.08);
  --font: 'Noto Sans KR', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-1);overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 15px var(--accent-glow)}50%{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(212,165,116,0.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp .4s ease-out both}

/* ─── Glass Card System ─── */
.glass{
  background:var(--glass-1);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);
  border-radius:16px;
  box-shadow:
    inset -1px -1px 3px rgba(0,0,0,1),
    20px 20px 20px rgba(0,0,0,0.2),
    inset 0 -10px 4px rgba(255,255,255,0.06),
    inset 0 4px 10px rgba(0,0,0,0.25);
  position:relative;
  overflow:hidden;
}
.glass::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-highlight),transparent);
}
.glass-2{
  background:var(--glass-2);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);border-radius:12px;
  box-shadow:inset -1px -1px 2px rgba(0,0,0,0.6),8px 8px 16px rgba(0,0,0,0.15),inset 0 -6px 3px rgba(255,255,255,0.04),inset 0 2px 6px rgba(0,0,0,0.2);
  position:relative;overflow:hidden;
}
.glass-2::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent)}
.glass-3{
  background:var(--glass-3);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.05);border-radius:10px;
}

/* ─── Layout ─── */
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg-deep);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(59,130,246,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(212,165,116,0.05) 0%,transparent 40%),radial-gradient(ellipse at 50% 90%,rgba(139,92,246,0.04) 0%,transparent 40%);
}
.side{width:260px;background:rgba(17,24,39,0.6);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.side-head{padding:24px 20px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-0.5px}
.logo-m{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent-warm),#E8B88A);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0C1220;box-shadow:0 0 20px var(--accent-glow)}
.side-nav{flex:1;padding:12px;overflow-y:auto}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);padding:12px 12px 4px}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-2);cursor:pointer;transition:all .2s;font-size:13px;font-weight:450;margin-bottom:2px}
.nav-i:hover{background:var(--glass-2);color:var(--text-1)}
.nav-i.on{background:rgba(212,165,116,0.12);color:var(--accent-warm);font-weight:600}
.nav-i .nb{margin-left:auto;background:var(--accent-warm);color:#0C1220;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center}
.side-foot{padding:16px;border-top:1px solid var(--border)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px}
.avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;flex-shrink:0}
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.ph{padding:28px 36px 20px;position:sticky;top:0;z-index:10;background:rgba(12,18,32,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.ph p{font-size:13px;color:var(--text-2);margin-top:4px}
.pb{padding:24px 36px 48px}

/* ─── Components ─── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:20px;position:relative}
.stat::after{content:'';position:absolute;top:0;left:20px;right:20px;height:2px;border-radius:1px}
.stat.bl::after{background:var(--accent)}.stat.gr::after{background:var(--success)}.stat.pu::after{background:var(--purple)}.stat.or::after{background:var(--accent-warm)}
.stat-l{font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.stat-v{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.stat-s{font-size:11px;color:var(--text-2);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-bl{background:rgba(59,130,246,0.15);color:#60A5FA}
.b-gr{background:rgba(16,185,129,0.15);color:#34D399}
.b-or{background:rgba(245,158,11,0.15);color:#FBBF24}
.b-pu{background:rgba(139,92,246,0.15);color:#A78BFA}
.b-rd{background:rgba(239,68,68,0.15);color:#F87171}
.b-gy{background:rgba(100,116,139,0.15);color:var(--text-3)}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;background:var(--glass-2);color:var(--text-2);border:1px solid var(--border);margin:2px}
.pbar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .6s ease}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:550;border:none;cursor:pointer;transition:all .2s;font-family:var(--font)}
.btn-p{background:linear-gradient(135deg,var(--accent-warm),#C8956C);color:#0C1220;box-shadow:0 0 20px var(--accent-glow)}
.btn-p:hover{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(212,165,116,0.15);transform:translateY(-1px)}
.btn-s{background:var(--glass-2);color:var(--text-1);border:1px solid var(--glass-border);backdrop-filter:blur(10px)}
.btn-s:hover{background:var(--glass-1);border-color:var(--glass-highlight)}
.btn-g{background:transparent;color:var(--text-2);border:none}.btn-g:hover{color:var(--text-1)}
.btn-sm{padding:5px 10px;font-size:12px}
.input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--text-1);width:100%;font-family:var(--font);outline:none;transition:all .2s}
.input:focus{border-color:var(--accent-warm);box-shadow:0 0 0 3px rgba(212,165,116,0.15)}
.input::placeholder{color:var(--text-3)}
select.input{cursor:pointer;appearance:none}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--glass-3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ct{font-size:14px;font-weight:600}

/* Credential */
.cred{padding:20px;position:relative}
.cred::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent-warm),var(--accent),var(--purple));border-radius:1px}
/* Talent */
.tc{padding:20px;transition:all .25s;cursor:pointer}
.tc:hover{border-color:var(--accent-warm);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.3),0 0 20px var(--accent-glow)}
.tc-av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:white}
.tc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.tc-sl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px}
.tc-sv{font-size:15px;font-weight:700;font-family:var(--mono)}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg-deep);
  background-image:radial-gradient(ellipse at 30% 30%,rgba(212,165,116,0.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 70%,rgba(59,130,246,0.06) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(139,92,246,0.04) 0%,transparent 40%);
}
.login-card{padding:48px 40px;width:430px;max-width:90vw}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.role{padding:16px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center;background:var(--glass-3)}
.role:hover{border-color:var(--glass-highlight);background:var(--glass-2)}
.role.sel{border-color:var(--accent-warm);background:rgba(212,165,116,0.1);box-shadow:0 0 20px var(--accent-glow)}
.role .ri{font-size:24px;margin-bottom:6px}
.role .rn{font-size:13px;font-weight:600}
.role .rd{font-size:10px;color:var(--text-3);margin-top:2px}
.role.fw{grid-column:span 2}

/* Review dots */
.rv-i{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.rv-dots{display:flex;gap:4px}
.rv-d{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text-3)}
.rv-d.on{border-color:var(--accent-warm);background:var(--accent-warm);color:#0C1220}

/* Status flow */
.sf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.sf-s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.sf-s.done{color:var(--success)}.sf-s.cur{color:var(--accent-warm);font-weight:600}
.sf-d{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px}
.sf-d.done{background:var(--success);border-color:var(--success);color:white}
.sf-d.cur{border-color:var(--accent-warm);animation:glowPulse 2s infinite}
.sf-l{width:24px;height:2px;background:rgba(255,255,255,0.08)}.sf-l.done{background:var(--success)}

/* Portfolio */
.port{padding:32px;max-width:700px}
.port-sec{margin-bottom:24px}
.port-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent-warm);margin-bottom:12px;font-weight:600}

@media(max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.side{display:none}.stats{grid-template-columns:1fr}.g2,.g3{grid-template-columns:1fr}.pb{padding:16px}}
`;

// ─── Helpers ───
const StatusBadge = ({s}) => {
  const m = {"진행중":"bl","검수중":"or","배정중":"pu","완료":"gr","배정됨":"pu","제출완료":"or","승인완료":"gr","수정요청":"rd","반려":"rd","일반":"bl","높음":"or"};
  return <span className={`badge b-${m[s]||"gy"}`}>{s}</span>;
};
const GradeBadge = ({g}) => <span className="badge" style={{background:`${gradeColors[g]}22`,color:gradeColors[g]}}>{g}</span>;
const Stars = ({v}) => <span style={{display:"inline-flex",alignItems:"center",gap:2}}>{I.star}<span style={{fontFamily:"var(--mono)",fontWeight:600,fontSize:13}}>{v}</span></span>;
const PBar = ({v,c="var(--accent-warm)"}) => <div className="pbar"><div className="pfill" style={{width:`${v}%`,background:c}}/></div>;

// ─── Login ───
function Login({onLogin}) {
  const [sel,setSel] = useState(null);
  const roles = [
    {k:"maker",i:"🛠️",n:"Maker",d:"과업 수행 청년"},
    {k:"reviewer",i:"🔍",n:"Reviewer",d:"작업물 검수자"},
    {k:"client",i:"🏢",n:"Client",d:"프로젝트 의뢰 기업"},
    {k:"admin",i:"⚙️",n:"Admin/PM",d:"운영 관리자"},
  ];
  return (
    <div className="login">
      <div className="login-card glass fade-up">
        <div style={{display:"flex",justifyContent:"center",marginBottom:20}}>
          <div className="logo"><div className="logo-m">L</div>로컬크루</div>
        </div>
        <div style={{fontSize:26,fontWeight:800,textAlign:"center",letterSpacing:-0.5}}>시작하기</div>
        <div style={{fontSize:13,color:"var(--text-2)",textAlign:"center",margin:"6px 0 32px"}}>역할을 선택하고 대시보드에 입장하세요</div>
        <div className="roles">
          {roles.map(r => (
            <div key={r.k} className={`role ${sel===r.k?"sel":""}`} onClick={()=>setSel(r.k)}>
              <div className="ri">{r.i}</div><div className="rn">{r.n}</div><div className="rd">{r.d}</div>
            </div>
          ))}
        </div>
        <button className="btn btn-p" style={{width:"100%",justifyContent:"center",padding:13,fontSize:14}} disabled={!sel} onClick={()=>sel&&onLogin(sel)}>
          {sel ? `${roles.find(r=>r.k===sel)?.n}로 입장` : "역할을 선택하세요"}
        </button>
      </div>
    </div>
  );
}

// ─── Sidebar ───
function Side({user,page,onNav,onOut,items}) {
  const bg = {Maker:"linear-gradient(135deg,#D4A574,#E8B88A)",Reviewer:"linear-gradient(135deg,#10B981,#34D399)",Client:"linear-gradient(135deg,#8B5CF6,#A78BFA)",Admin:"linear-gradient(135deg,#EF4444,#F87171)"};
  return (
    <div className="side">
      <div className="side-head"><div className="logo"><div className="logo-m">L</div>로컬크루</div></div>
      <nav className="side-nav">
        {items.map((sec,si) => (
          <div key={si}>
            {sec.label && <div className="nav-label">{sec.label}</div>}
            {sec.items.map(it => (
              <div key={it.id} className={`nav-i ${page===it.id?"on":""}`} onClick={()=>onNav(it.id)}>
                {it.icon}<span>{it.name}</span>
                {it.badge && <span className="nb">{it.badge}</span>}
              </div>
            ))}
          </div>
        ))}
      </nav>
      <div className="side-foot">
        <div className="side-user">
          <div className="avatar" style={{background:bg[user.role]}}>{(user.name||"?")[0]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div>
            <div style={{fontSize:11,color:"var(--text-3)"}}>{user.role}{user.grade?` · ${user.grade}`:""}</div>
          </div>
          <div style={{cursor:"pointer",color:"var(--text-3)"}} onClick={onOut}>{I.out}</div>
        </div>
      </div>
    </div>
  );
}

// ─── Portfolio ───
function Portfolio({user}) {
  const [tpl,setTpl] = useState("project");
  const [gen,setGen] = useState(false);
  const [done,setDone] = useState(false);
  const go = () => {setGen(true);setTimeout(()=>{setGen(false);setDone(true)},1200)};
  return (<div>
    <div className="ph"><h1>포트폴리오 생성</h1><p>수행 데이터 기반 자동 포트폴리오</p></div>
    <div className="pb">
      <div className="glass" style={{padding:20,marginBottom:20}}>
        <div className="ct" style={{marginBottom:14}}>템플릿 선택</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {[["project","프로젝트형"],["resume","지원서형"],["career","경력기술서형"],["proposal","제안서형"]].map(([k,v])=>(
            <button key={k} className={`btn ${tpl===k?"btn-p":"btn-s"}`} onClick={()=>{setTpl(k);setDone(false)}}>{v}</button>
          ))}
        </div>
      </div>
      <div className="glass" style={{padding:20,marginBottom:20}}>
        <div className="ct" style={{marginBottom:14}}>강조 프로젝트</div>
        {MOCK_CREDENTIALS.map(c=>(
          <label key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"}}>
            <input type="checkbox" defaultChecked style={{accentColor:"var(--accent-warm)"}}/>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:550}}>{c.project}</div><div style={{fontSize:11,color:"var(--text-3)"}}>{c.task}</div></div>
            <Stars v={c.rating}/>
          </label>
        ))}
      </div>
      <button className="btn btn-p" onClick={go} disabled={gen} style={{marginBottom:24}}>{gen?"생성중...":"포트폴리오 생성"}</button>
      {done && (
        <div className="glass port fade-up">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
            <div>
              <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:1.2,color:"var(--accent-warm)",marginBottom:4}}>PORTFOLIO</div>
              <div style={{fontSize:22,fontWeight:700}}>{user.name}</div>
              <div style={{fontSize:13,color:"var(--text-2)"}}>{user.skills.join(" · ")}</div>
            </div>
            <div style={{display:"flex",gap:8}}><button className="btn btn-s btn-sm">{I.dl} PDF</button><button className="btn btn-s btn-sm">{I.link} URL</button></div>
          </div>
          <div className="port-sec"><h3>핵심 역량</h3><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{user.skills.map(s=><span key={s} className="tag" style={{padding:"5px 12px",fontSize:12}}>{s}</span>)}</div></div>
          <div className="port-sec"><h3>수행 실적</h3>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16}}>
              {[["완료",user.completedProjects],["마감률",`${user.deadlineRate}%`],["평점",user.avgRating],["신뢰도",user.trustScore]].map(([l,v])=>(
                <div key={l} style={{textAlign:"center"}}><div style={{fontSize:22,fontWeight:700,fontFamily:"var(--mono)"}}>{v}</div><div style={{fontSize:11,color:"var(--text-3)"}}>{l}</div></div>
              ))}
            </div>
          </div>
          <div className="port-sec"><h3>프로젝트 이력</h3>
            {MOCK_CREDENTIALS.map(c=>(
              <div key={c.id} style={{padding:"14px 0",borderBottom:"1px solid var(--border)"}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><div style={{fontWeight:600,fontSize:14}}>{c.project}</div><Stars v={c.rating}/></div>
                <div style={{fontSize:12,color:"var(--text-2)",marginTop:4}}>{c.task} | {c.role} | {c.period}</div>
                <div style={{display:"flex",gap:4,marginTop:6}}>{c.skills.map(s=><span key={s} className="tag">{s}</span>)}</div>

// ─── Talent Search ───
function TalentSearch() {
  const [sf,setSf]=useState("");
  const [gf,setGf]=useState("all");
  const filtered=MOCK_TALENTS.filter(t=>{if(gf!=="all"&&t.grade!==gf)return false;if(sf&&!t.skills.some(s=>s.toLowerCase().includes(sf.toLowerCase())))return false;return true});
  return (<div>
    <div className="ph"><h1>인재 검색</h1><p>검증된 수행 이력 기반 인재 탐색</p></div>
    <div className="pb">
      <div className="glass" style={{padding:16,marginBottom:20}}>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          <input className="input" placeholder="기술 검색 (예: React, Python)" value={sf} onChange={e=>setSf(e.target.value)} style={{flex:1,minWidth:200}}/>
          <select className="input" value={gf} onChange={e=>setGf(e.target.value)} style={{width:140}}><option value="all">전체 등급</option><option value="Starter">Starter</option><option value="Verified">Verified</option><option value="Advanced">Advanced</option></select>
        </div>
      </div>
      <div className="g3">
        {filtered.map((t,i)=>(
          <div key={t.id} className="glass tc fade-up" style={{animationDelay:`${i*.06}s`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",gap:12,alignItems:"center"}}>
                <div className="tc-av" style={{background:`linear-gradient(135deg,${gradeColors[t.grade]},${gradeColors[t.grade]}88)`}}>{t.name[0]}</div>
                <div><div style={{fontWeight:600,fontSize:15}}>{t.name}</div><div style={{fontSize:12,color:"var(--text-3)"}}>{t.region} · <GradeBadge g={t.grade}/></div></div>
              </div>
              <span className={`badge ${t.available?"b-gr":"b-gy"}`}>{t.available?"가용":"작업중"}</span>
            </div>
            <div className="tc-stats">
              <div><div className="tc-sl">신뢰도</div><div className="tc-sv">{t.trustScore}</div></div>
              <div><div className="tc-sl">마감률</div><div className="tc-sv">{t.deadlineRate}%</div></div>
              <div><div className="tc-sl">평점</div><div className="tc-sv" style={{display:"flex",alignItems:"center",gap:2}}>{I.star}{t.rating}</div></div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>{t.skills.map(s=><span key={s} className="tag">{s}</span>)}</div>
            <div style={{fontSize:11,color:"var(--text-3)"}}>완료 프로젝트 {t.projects}건</div>
          </div>
        ))}
      </div>
    </div>
  </div>);
}

// ─── Admin Dashboard ───
function AdminDash() {
  const active=MOCK_PROJECTS.filter(p=>p.status!=="완료");
  const risk=MOCK_PROJECTS.filter(p=>{const d=new Date(p.deadline);return d-new Date()<7*864e5&&p.status!=="완료"});
  return (<div>
    <div className="ph"><h1>운영 대시보드</h1><p>플랫폼 전체 현황 관리</p></div>
    <div className="pb">
      <div className="stats">
        {[["전체 프로젝트",MOCK_PROJECTS.length,`진행중 ${active.length}건`,"bl"],["납기 위험",risk.length,"7일 이내","or"],["활성 작업자",MOCK_TALENTS.length,"대전·세종·청주","gr"],["발급 크레덴셜",47,"이번 달 +12","pu"]].map(([l,v,s,c],i)=>(
          <div key={i} className={`glass stat ${c} fade-up`} style={{animationDelay:`${i*.06}s`}}><div className="stat-l">{l}</div><div className="stat-v" style={{color:c==="bl"?"#60A5FA":c==="gr"?"#34D399":c==="pu"?"#A78BFA":"var(--accent-warm)"}}>{v}</div><div className="stat-s">{s}</div></div>
        ))}
      </div>
      <div className="g2" style={{marginBottom:24}}>
        <div className="glass" style={{padding:20}}>
          <div className="ch"><span className="ct">프로젝트 현황</span></div>
          <table><thead><tr><th>프로젝트</th><th>상태</th><th>진행률</th><th>마감</th></tr></thead>
          <tbody>{MOCK_PROJECTS.map(p=>(
            <tr key={p.id}><td style={{fontWeight:550,fontSize:13}}>{p.name}</td><td><StatusBadge s={p.status}/></td>
            <td><PBar v={p.progress} c={p.progress===100?"var(--success)":p.progress>70?"var(--accent-warm)":"var(--warning)"}/></td>
            <td style={{fontSize:12,color:"var(--text-2)"}}>{p.deadline}</td></tr>
          ))}</tbody></table>
        </div>
        <div className="glass" style={{padding:20}}>
          <div className="ch"><span className="ct" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"var(--warning)"}}>{I.alert}</span>납기 위험 · 지역 통계</span></div>
          {risk.map(p=>(
            <div key={p.id} style={{padding:"12px 0",borderBottom:"1px solid var(--border)"}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><div style={{fontWeight:550,fontSize:13}}>{p.name}</div><span className="badge b-or">{p.deadline}</span></div>
              <div style={{fontSize:11,color:"var(--text-3)",marginTop:4}}>진행률 {p.progress}% · 태스크 {p.completedTasks}/{p.tasks}건</div>
            </div>
          ))}
          <div style={{marginTop:20}}>
            <div className="ct" style={{marginBottom:12,fontSize:13}}>지역별 참여자</div>
            {[["대전",45,62],["세종",18,25],["청주",12,16]].map(([r,c,pct])=>(
              <div key={r} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span>{r}</span><span style={{color:"var(--text-3)"}}>{c}명 ({pct}%)</span></div>
                <PBar v={pct} c="var(--purple)"/>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="glass" style={{padding:20}}>
        <div className="ch"><span className="ct">최근 활동 로그</span></div>
        {[
          {t:"14:32",a:"김서연님이 '상품 카드 컴포넌트 제작' 진행 시작",c:"var(--accent)"},
          {t:"13:15",a:"최유나님이 '반응형 레이아웃 적용' 결과물 제출",c:"var(--warning)"},
          {t:"11:48",a:"'스타트업 IR 자료 디자인' 검수 완료",c:"var(--success)"},
          {t:"10:22",a:"박민수님 배지 발급: 고급 React 개발",c:"var(--purple)"},
          {t:"09:05",a:"에듀플러스 '교육 앱 QA 테스트' 등록",c:"var(--accent-warm)"},
        ].map((l,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
            <span style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--text-3)",minWidth:40}}>{l.t}</span>
            <div style={{width:8,height:8,borderRadius:"50%",background:l.c,flexShrink:0,boxShadow:`0 0 8px ${l.c}`}}/>
            <span style={{fontSize:13}}>{l.a}</span>
          </div>
        ))}
      </div>
    </div>
  </div>);
}

// ─── Projects ───
function Projects({onSelect}) {
  return (<div>
    <div className="ph"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><h1>프로젝트 관리</h1><p>전체 프로젝트 조회 및 관리</p></div><button className="btn btn-p">{I.plus} 프로젝트 등록</button></div></div>
    <div className="pb">
      {MOCK_PROJECTS.map((p,i)=>(
        <div key={p.id} className="glass fade-up" style={{padding:20,marginBottom:12,cursor:"pointer",animationDelay:`${i*.04}s`}} onClick={()=>onSelect(p)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <span style={{fontSize:15,fontWeight:600}}>{p.name}</span><StatusBadge s={p.status}/>
                {p.security==="높음"&&<span className="badge b-or" style={{fontSize:10}}>{I.shield} 높음</span>}
              </div>
              <div style={{fontSize:12,color:"var(--text-3)"}}>{p.client} · 마감 {p.deadline} · {p.budget}</div>
              <div style={{marginTop:8,display:"flex",gap:4}}>{p.modules.map(m=><span key={m} className="tag">{m}</span>)}</div>
            </div>
            <div style={{textAlign:"right",minWidth:100}}>
              <div style={{fontSize:22,fontWeight:700,fontFamily:"var(--mono)"}}>{p.progress}%</div>
              <div style={{fontSize:11,color:"var(--text-3)"}}>태스크 {p.completedTasks}/{p.tasks}</div>
              <PBar v={p.progress} c={p.progress===100?"var(--success)":"var(--accent-warm)"}/>
            </div>
          </div>
        </div>
      ))}
    </div>
  </div>);
}

// ─── Project Detail ───
function ProjectDetail({project:p,onBack}) {
  const tasks=MOCK_TASKS.filter(t=>t.projectId===p.id);
  return (<div>
    <div className="ph">
      <button className="btn btn-g btn-sm" onClick={onBack} style={{marginBottom:8}}>← 프로젝트 목록</button>
      <div style={{display:"flex",justifyContent:"space-between"}}><div><h1>{p.name}</h1><p>{p.client} · {p.description}</p></div><StatusBadge s={p.status}/></div>
    </div>
    <div className="pb">
      <div className="stats" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
        {[["진행률",`${p.progress}%`,"bl"],["총 태스크",p.tasks,"pu"],["완료",p.completedTasks,"gr"],["보안",p.security,"or"],["예산",p.budget.replace("원",""),"bl"]].map(([l,v,c],i)=>(
          <div key={i} className={`glass stat ${c}`} style={{padding:16}}><div className="stat-l">{l}</div><div className="stat-v" style={{fontSize:22,color:c==="bl"?"#60A5FA":c==="gr"?"#34D399":c==="pu"?"#A78BFA":"var(--accent-warm)"}}>{v}</div></div>
        ))}
      </div>
      <div className="glass" style={{padding:20}}>
        <div className="ch"><span className="ct">태스크 목록</span><button className="btn btn-p btn-sm">{I.plus} 태스크 추가</button></div>
        <table><thead><tr><th>태스크</th><th>담당</th><th>난이도</th><th>상태</th><th>자동검증</th><th>마감</th><th>평점</th></tr></thead>
        <tbody>{tasks.map(t=>(
          <tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td>{t.assignee}</td>
          <td><span className={`badge ${t.difficulty==="상"?"b-rd":"b-or"}`}>{t.difficulty}</span></td>
          <td><StatusBadge s={t.status}/></td>
          <td>{t.autoCheck?<span className="badge b-gr">통과</span>:<span className="badge b-gy">대기</span>}</td>
          <td style={{fontSize:12,color:"var(--text-2)"}}>{t.deadline}</td>
          <td>{t.reviewScore?<Stars v={t.reviewScore}/>:"-"}</td></tr>
        ))}</tbody></table>
      </div>
    </div>
  </div>);
}

// ─── Review ───
function Review() {
  const [sc,setSc]=useState({deadline:5,quality:4,speed:5,comm:4,guide:5,rework:5});
  const items=[{k:"deadline",l:"마감 준수"},{k:"quality",l:"요구사항 충족도"},{k:"speed",l:"수정 대응 속도"},{k:"comm",l:"커뮤니케이션 성실도"},{k:"guide",l:"규약 준수도"},{k:"rework",l:"재작업 불발생"}];
  return (<div>
    <div className="ph"><h1>리뷰 / 평가</h1><p>구조화된 항목으로 작업 결과 기록</p></div>
    <div className="pb">
      <div className="glass" style={{padding:20,maxWidth:600}}>
        <div className="ch"><span className="ct">평가: 메인 히어로 섹션 퍼블리싱</span><span className="badge b-bl">김서연</span></div>
        {items.map(it=>(
          <div className="rv-i" key={it.k}><span style={{fontSize:13}}>{it.l}</span>
            <div className="rv-dots">{[1,2,3,4,5].map(n=>(
              <div key={n} className={`rv-d ${sc[it.k]>=n?"on":""}`} onClick={()=>setSc(p=>({...p,[it.k]:n}))}>{n}</div>
            ))}</div>
          </div>
        ))}
        <div style={{marginTop:16}}><div style={{fontSize:12,color:"var(--text-3)",marginBottom:6}}>코멘트</div><textarea className="input" rows={3} placeholder="작업 결과에 대한 의견" style={{resize:"vertical"}}/></div>
        <div style={{display:"flex",gap:10,marginTop:16}}><button className="btn btn-p">승인</button><button className="btn btn-s" style={{borderColor:"var(--danger)",color:"var(--danger)"}}>반려</button></div>
      </div>
    </div>
  </div>);
}

// ─── App ───
function App() {
  const [role,setRole]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [selProj,setSelProj]=useState(null);
  const user=role?MOCK_USERS[role]:null;

  const navs={
    maker:[{items:[{id:"dashboard",name:"대시보드",icon:I.home},{id:"tasks",name:"내 과업",icon:I.check,badge:2},{id:"credentials",name:"크레덴셜",icon:I.badge},{id:"portfolio",name:"포트폴리오",icon:I.file}]}],
    reviewer:[{items:[{id:"dashboard",name:"대시보드",icon:I.home},{id:"review",name:"리뷰 대기",icon:I.check,badge:3},{id:"credentials",name:"크레덴셜",icon:I.badge}]}],
    client:[{items:[{id:"dashboard",name:"대시보드",icon:I.home},{id:"projects",name:"프로젝트",icon:I.folder},{id:"talent",name:"인재 검색",icon:I.search}]}],
    admin:[{label:"운영",items:[{id:"dashboard",name:"운영 대시보드",icon:I.chart},{id:"projects",name:"프로젝트 관리",icon:I.folder},{id:"review",name:"리뷰 관리",icon:I.badge}]},{label:"관리",items:[{id:"users",name:"사용자 관리",icon:I.users},{id:"talent",name:"인재 검색",icon:I.search},{id:"credentials",name:"크레덴셜",icon:I.badge}]}],
  };

  const nav=id=>{setPage(id);setSelProj(null)};

  const renderPage=()=>{
    if(!user)return null;
    if(selProj)return <ProjectDetail project={selProj} onBack={()=>setSelProj(null)}/>;
    switch(page){
      case "dashboard": return role==="admin"?<AdminDash/>:role==="client"?<ClientDash user={user}/>:<MakerDash user={user}/>;
      case "projects": return <Projects onSelect={setSelProj}/>;
      case "tasks": return (<div><div className="ph"><h1>내 과업</h1><p>배정된 태스크 관리</p></div><div className="pb"><div className="glass" style={{padding:20}}><table><thead><tr><th>태스크</th><th>프로젝트</th><th>상태</th><th>난이도</th><th>마감</th></tr></thead><tbody>{(role==="admin"?MOCK_TASKS:MOCK_TASKS.filter(t=>t.assignee===user.name)).map(t=><tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td style={{fontSize:12,color:"var(--text-2)"}}>{MOCK_PROJECTS.find(p=>p.id===t.projectId)?.name}</td><td><StatusBadge s={t.status}/></td><td><span className={`badge ${t.difficulty==="상"?"b-rd":"b-or"}`}>{t.difficulty}</span></td><td style={{fontSize:12,color:"var(--text-2)"}}>{t.deadline}</td></tr>)}</tbody></table></div></div></div>);
      case "credentials": return <Creds/>;
      case "portfolio": return <Portfolio user={user}/>;
      case "talent": return <TalentSearch/>;
      case "review": return <Review/>;
      case "users": return (<div><div className="ph"><h1>사용자 관리</h1></div><div className="pb"><div className="glass" style={{padding:20}}><table><thead><tr><th>이름</th><th>등급</th><th>신뢰도</th><th>완료</th><th>마감률</th><th>지역</th></tr></thead><tbody>{MOCK_TALENTS.map(t=><tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td><GradeBadge g={t.grade}/></td><td style={{fontFamily:"var(--mono)"}}>{t.trustScore}</td><td>{t.projects}건</td><td>{t.deadlineRate}%</td><td>{t.region}</td></tr>)}</tbody></table></div></div></div>);
      default: return <MakerDash user={user}/>;
    }
  };

  if(!role)return(<><style>{css}</style><Login onLogin={r=>{setRole(r);setPage("dashboard")}}/></>);

  return (<><style>{css}</style>
    <div className="app">
      <Side user={user} page={page} onNav={nav} onOut={()=>{setRole(null);setPage("dashboard")}} items={navs[role]||navs.maker}/>
      <div className="main">{renderPage()}</div>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
