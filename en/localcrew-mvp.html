// ─── Glassmorphism CSS ───
const css = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --bg-deep: #0C1220;
  --bg-surface: rgba(17,24,39,0.85);
  --glass-1: rgba(255,255,255,0.08);
  --glass-2: rgba(255,255,255,0.05);
  --glass-3: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.12);
  --glass-highlight: rgba(255,255,255,0.20);
  --glass-blur: 40px;
  --accent: #3B82F6;
  --accent-warm: #D4A574;
  --accent-glow: rgba(212,165,116,0.25);
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --purple: #8B5CF6;
  --text-1: #F1F5F9;
  --text-2: #94A3B8;
  --text-3: #64748B;
  --border: rgba(255,255,255,0.08);
  --font: 'Noto Sans KR', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-1);overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 15px var(--accent-glow)}50%{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(212,165,116,0.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp .4s ease-out both}

/* ─── Glass Card System ─── */
.glass{
  background:var(--glass-1);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);
  border-radius:16px;
  box-shadow:
    inset -1px -1px 3px rgba(0,0,0,1),
    20px 20px 20px rgba(0,0,0,0.2),
    inset 0 -10px 4px rgba(255,255,255,0.06),
    inset 0 4px 10px rgba(0,0,0,0.25);
  position:relative;
  overflow:hidden;
}
.glass::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-highlight),transparent);
}
.glass-2{
  background:var(--glass-2);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);border-radius:12px;
  box-shadow:inset -1px -1px 2px rgba(0,0,0,0.6),8px 8px 16px rgba(0,0,0,0.15),inset 0 -6px 3px rgba(255,255,255,0.04),inset 0 2px 6px rgba(0,0,0,0.2);
  position:relative;overflow:hidden;
}
.glass-2::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent)}
.glass-3{
  background:var(--glass-3);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.05);border-radius:10px;
}

/* ─── Layout ─── */

}
.side{width:260px;background:rgba(17,24,39,0.6);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.side-head{padding:24px 20px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-0.5px}
.logo-m{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent-warm),#E8B88A);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0C1220;box-shadow:0 0 20px var(--accent-glow)}
.side-nav{flex:1;padding:12px;overflow-y:auto}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);padding:12px 12px 4px}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-2);cursor:pointer;transition:all .2s;font-size:13px;font-weight:450;margin-bottom:2px}
.nav-i:hover{background:var(--glass-2);color:var(--text-1)}
.nav-i.on{background:rgba(212,165,116,0.12);color:var(--accent-warm);font-weight:600}
.nav-i .nb{margin-left:auto;background:var(--accent-warm);color:#0C1220;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center}
.side-foot{padding:16px;border-top:1px solid var(--border)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px}

.main{flex:1;overflow-y:auto;overflow-x:hidden}
.ph{padding:28px 36px 20px;position:sticky;top:0;z-index:10;background:rgba(12,18,32,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.ph p{font-size:13px;color:var(--text-2);margin-top:4px}
.pb{padding:24px 36px 48px}

/* ─── Components ─── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:20px;position:relative}
.stat::after{content:'';position:absolute;top:0;left:20px;right:20px;height:2px;border-radius:1px}
.stat.bl::after{background:var(--accent)}.stat.gr::after{background:var(--success)}.stat.pu::after{background:var(--purple)}.stat.or::after{background:var(--accent-warm)}
.stat-l{font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.stat-v{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.stat-s{font-size:11px;color:var(--text-2);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-bl{background:rgba(59,130,246,0.15);color:#60A5FA}
.b-gr{background:rgba(16,185,129,0.15);color:#34D399}
.b-or{background:rgba(245,158,11,0.15);color:#FBBF24}
.b-pu{background:rgba(139,92,246,0.15);color:#A78BFA}
.b-rd{background:rgba(239,68,68,0.15);color:#F87171}
.b-gy{background:rgba(100,116,139,0.15);color:var(--text-3)}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;background:var(--glass-2);color:var(--text-2);border:1px solid var(--border);margin:2px}
.pbar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .6s ease}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:550;border:none;cursor:pointer;transition:all .2s;font-family:var(--font)}
.btn-p{background:linear-gradient(135deg,var(--accent-warm),#C8956C);color:#0C1220;box-shadow:0 0 20px var(--accent-glow)}
.btn-p:hover{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(212,165,116,0.15);transform:translateY(-1px)}
.btn-s{background:var(--glass-2);color:var(--text-1);border:1px solid var(--glass-border);backdrop-filter:blur(10px)}
.btn-s:hover{background:var(--glass-1);border-color:var(--glass-highlight)}
.btn-g{background:transparent;color:var(--text-2);border:none}.btn-g:hover{color:var(--text-1)}
.btn-sm{padding:5px 10px;font-size:12px}
.input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--text-1);width:100%;font-family:var(--font);outline:none;transition:all .2s}
.input:focus{border-color:var(--accent-warm);box-shadow:0 0 0 3px rgba(212,165,116,0.15)}
.input::placeholder{color:var(--text-3)}
select.input{cursor:pointer;appearance:none}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--glass-3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

// ─── Helpers ───
const StatusBadge = ({s}) => {
  const m = {"In progress":"bl","In review":"or","Assigning":"pu","Done":"gr","Assigned":"pu","Submitted":"or","Approved":"gr","Revision":"rd","Rejected":"rd","Standard":"bl","High":"or"};
  return <span className={`badge b-${m[s]||"gy"}`}>{s}</span>;
};
const GradeBadge = ({g}) => <span className="badge" style={{background:`${gradeColors[g]}22`,color:gradeColors[g]}}>{g}</span>;
const Stars = ({v}) => <span style={{display:"inline-flex",alignItems:"center",gap:2}}>{I.star}<span style={{fontFamily:"var(--mono)",fontWeight:600,fontSize:13}}>{v}</span></span>;
const PBar = ({v,c="var(--accent-warm)"}) => <div className="pbar"><div className="pfill" style={{width:`${v}%`,background:c}}/></div>;

function matchTalentQuery(t, q) {
  if (!q || !q.trim()) return true;
  const raw = q.trim();
  const lower = raw.toLowerCase();
  if (t.name.includes(raw)) return true;
  if (t.region.includes(raw)) return true;
  if (t.grade.toLowerCase().includes(lower)) return true;
  return t.skills.some(s => s.toLowerCase().includes(lower) || s.includes(raw));
}

function talentSuggestions(query) {
  const q = (query || "").trim();
  if (!q) return [];
  const lower = q.toLowerCase();
  const names = MOCK_TALENTS.filter(t => t.name.includes(q)).map(t => t.name);
  const skills = [...new Set(MOCK_TALENTS.flatMap(t => t.skills).filter(s => s.toLowerCase().includes(lower) || s.includes(q)))];
  const regions = [...new Set(MOCK_TALENTS.map(t => t.region).filter(r => r.includes(q)))];
  return [...new Set([...names, ...skills, ...regions])].slice(0, 8);
}

function ProjectCreateModal({ open, onClose, onSubmit, clientLabel }) {
  const [form, setForm] = useState({ name: "", deadline: "", budget: "", security: "Standard", description: "" });
  const [err, setErr] = useState("");
  if (!open) return null;
  const submit = () => {
    if (!form.name.trim()) { setErr("Enter a project name."); return; }
    const budgetRaw = form.budget.trim();
    const budget = budgetRaw ? (budgetRaw.includes(" KRW") ? budgetRaw : budgetRaw + " KRW") : "협의";
    onSubmit({
      name: form.name.trim(),
      deadline: form.deadline || "2026-06-30",
      budget,
      security: form.security,
      description: form.description.trim(),
      client: clientLabel || "LocalTech Inc.",
    });
    setForm({ name: "", deadline: "", budget: "", security: "Standard", description: "" });
    setErr("");
    onClose();
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <h3>New project brief</h3>
        {err && <p style={{ color: "var(--danger)", fontSize: 12, margin: "0 0 10px" }}>{err}</p>}
        <input className="input" placeholder="Project name *" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
        <input className="input" placeholder="Due date (e.g. 2026-06-30)" value={form.deadline} onChange={e => setForm({ ...form, deadline: e.target.value })} />
        <input className="input" placeholder="Budget (e.g. 2,000,000 KRW)" value={form.budget} onChange={e => setForm({ ...form, budget: e.target.value })} />
        <select className="input" value={form.security} onChange={e => setForm({ ...form, security: e.target.value })}>
          <option value="Standard">Security: standard</option>
          <option value="High">Security: high</option>
        </select>
        <textarea className="input" rows={3} placeholder="Project description" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} style={{ resize: "vertical" }} />
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <button type="button" className="btn btn-p" onClick={submit}>Create</button>
          <button type="button" className="btn btn-s" onClick={onClose}>취소</button>
        </div>
      </div>
    </div>
  );
}

function DemoBanner({flow, role, onSwitchRole, onGoTasks, onGoReview, onGoCreds, onOpenTour}) {
  const lerRole = role==="maker"||role==="reviewer";
  const roleTag = {maker:"Maker",reviewer:"Reviewer",client:"Client · Enterprise",admin:"Admin/PM"}[role]||role;
  const steps = [
    {n:1,l:"Submit",done:flow>=1},
    {n:2,l:"Review",done:flow>=2},
    {n:3,l:"LER issued",done:flow>=2},
    {n:4,l:"Verify",done:flow>=2},
  ];
  return (
    <div className="demo-bar">
      <div>
        <strong>Demo</strong> · <span style={{color:"var(--accent-warm)"}}>{roleTag}</span> · Sample data
        <span style={{marginLeft:8,color:"var(--text-3)"}}>{lerRole?"LER issuance flow":"Role-based menus & screens"}</span>
      </div>
      {lerRole&&<div className="flow-pills">{steps.map(s=><span key={s.n} className={"fp"+(s.done?" on":"")}>{s.n}. {s.l}</span>)}</div>}

function tourDisplayFlow(tourIdx, flow) {
  if(tourIdx < 0) return flow;
  const s = TOUR_STEPS[Math.min(tourIdx, TOUR_STEPS.length - 1)];
  return Math.max(flow, s.previewFlow || 0);
}

function applyTourScene(idx, setRole, setPage, setSelProj, opts) {
  opts = opts || {};
  const s = TOUR_STEPS[Math.max(0, Math.min(idx, TOUR_STEPS.length - 1))].scene;
  if(!s) return;
  if(!opts.keepRole && s.role) setRole(s.role);
  setPage(s.page);
  setSelProj(null);
}

function LerExplainBox() {
  return (
    <div className="tour-ler-box">
      <strong>LER = Learning & Employment Record</strong>

        <li>Steps 3–6 walk you through issuing one LER record.</li>
      </ul>

function DemoTour({tourIdx, flow, onPrev, onNext, onGoTo, onSkip, onAction}) {
  if(tourIdx < 0) return null;
  const idx = Math.max(0, Math.min(tourIdx, TOUR_STEPS.length - 1));
  const cur = TOUR_STEPS[idx];
  const flowOk = cur.needFlow == null || flow >= cur.needFlow;
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  return (
    <>
      <div className="tour-scrim" onClick={(e)=>{stop(e);onSkip();}} aria-hidden="true"/>
      <div className="tour-bg-label">Preview · {cur.scene?.label}</div>
      <div className="tour-ui">
        <div className="tour-shell" onClick={e=>e.stopPropagation()}>
          <button type="button" className="tour-arrow" disabled={idx===0} title="Previous step" onClick={(e)=>{stop(e);onPrev();}}>‹</button>
          <div className="tour-box">
            <div className="tour-step-num">Guide {idx + 1} / {TOUR_STEPS.length}</div>
            <div className="tour-dots">
              {TOUR_STEPS.map((s,i)=>(
                <button key={i} type="button" className={i===idx?"on":""} title={s.t} onClick={(e)=>{stop(e);onGoTo(i);}}>{s.short}</button>
              ))}
            </div>
            <h3>{cur.t}</h3>
            <p>{cur.b}</p>
            {cur.ler && <LerExplainBox/>}
            {!flowOk && cur.needFlow > 0 && (
              <p style={{fontSize:12,color:"var(--warning)",margin:"0 0 12px"}}>
                ⚠ To complete for real: {cur.needFlow === 1 ? "Step 1 (submit work)" : "Step 3 (approve)"} — use ‹ › to preview other screens.
              </p>
            )}
            <div className="tour-nav">
              {cur.action && (
                <button type="button" className="btn btn-p" disabled={!flowOk && cur.needFlow > 0} onClick={(e)=>{stop(e);onAction(cur.action, idx);}}>
                  {cur.btn}
                </button>
              )}
              <button type="button" className="btn btn-s" style={{marginLeft:"auto"}} onClick={(e)=>{stop(e);onSkip();}}>Skip</button>
            </div>
          </div>
          <button type="button" className="tour-arrow" disabled={idx>=TOUR_STEPS.length-1} title="Next step" onClick={(e)=>{stop(e);onNext();}}>›</button>
        </div>
      </div>
    </>
  );
}

  const suggestions = useMemo(() => talentSuggestions(sf), [sf]);
  const filtered = MOCK_TALENTS.filter(t => {
    if (gf !== "all" && t.grade !== gf) return false;
    return matchTalentQuery(t, sf);
  });
  const pickSuggestion = (v) => { setSf(v); setShowAc(false); };
  return (<div>
    <div className="ph"><h1>Talent search</h1><p>Search talent by verified work history</p></div>
    <div className="pb">

              className="input"
              placeholder="Search by name, skill, or region (e.g. Kim, React, Daejeon)"

        </div>
        <p className="search-hint">이름·기술·지역 일부만 입력해도 검색됩니다. 예: &quot;김&quot;, &quot;React&quot;, &quot;Regional&quot;</p>

    <div className="ph">
      <button className="btn btn-g btn-sm" onClick={onBack} style={{marginBottom:8}}>← Back to projects</button>
      <div style={{display:"flex",justifyContent:"space-between"}}><div><h1>{p.name}</h1><p>{p.client} · {p.description}</p></div><StatusBadge s={p.status}/></div>
    </div>
    <div className="pb">
      <div className="stats" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
        {[["Progress",`${p.progress}%`,"bl"],["Total tasks",p.tasks,"pu"],["Done",p.completedTasks,"gr"],["Security",p.security,"or"],["Budget",p.budget.replace(" KRW",""),"bl"]].map(([l,v,c],i)=>(
          <div key={i} className={`glass stat ${c}`} style={{padding:16}}><div className="stat-l">{l}</div><div className="stat-v" style={{fontSize:22,color:c==="bl"?"#60A5FA":c==="gr"?"#34D399":c==="pu"?"#A78BFA":"var(--accent-warm)"}}>{v}</div></div>
        ))}
      </div>
      <div className="glass" style={{padding:20}}>
        <div className="ch"><span className="ct">Task list</span><button className="btn btn-p btn-sm">{I.plus} Add task</button></div>
        <table><thead><tr><th>Task</th><th>Assignee</th><th>Level</th><th>Status</th><th>Auto-check</th><th>Due</th><th>Rating</th></tr></thead>
        <tbody>{tasks.map(t=>(
          <tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td>{t.assignee}</td>
          <td><span className={`badge ${t.difficulty==="Hard"?"b-rd":"b-or"}`}>{t.difficulty}</span></td>
          <td><StatusBadge s={t.status}/></td>
          <td>{t.autoCheck?<span className="badge b-gr">Pass</span>:<span className="badge b-gy">Pending</span>}</td>
          <td style={{fontSize:12,color:"var(--text-2)"}}>{t.deadline}</td>
          <td>{t.reviewScore?<Stars v={t.reviewScore}/>:"-"}</td></tr>
        ))}</tbody></table>
      </div>
    </div>
  </div>);
}

// ─── Review ───
function Review({flow, onApprove}) {
  const [sc,setSc]=useState({deadline:5,quality:4,speed:5,comm:4,guide:5,rework:5});
  const [done,setDone]=useState(flow>=2);
  const items=[{k:"deadline",l:"Deadline adherence"},{k:"quality",l:"Requirements met"},{k:"speed",l:"Revision turnaround"},{k:"comm",l:"Communication"},{k:"guide",l:"Guideline compliance"},{k:"rework",l:"No rework needed"}];
  const pending = flow===1;
  const approve = () => { onApprove(); setDone(true); };
  return (<div>
    <div className="ph"><h1>Review & rating</h1><p>Record outcomes with structured criteria</p></div>
    <div className="pb">
      {pending&&<div className="glass flow-card" style={{padding:14,marginBottom:16,maxWidth:600}}><span className="badge b-or">Pending review</span> <span style={{fontSize:13,marginLeft:8}}>Product card component — submitted by Maker</span></div>}
      {done&&flow>=2&&<div className="glass" style={{padding:14,marginBottom:16,maxWidth:600,background:"rgba(16,185,129,.12)",border:"1px solid rgba(16,185,129,.3)"}}><span className="badge b-gr">Approved</span> <span style={{fontSize:13,marginLeft:8}}>LER issued · {DEMO_NEW_CRED.verifyId}</span></div>}
      <div className={"glass"+(pending?" hl-demo":"")} style={{padding:20,maxWidth:600}}>
        <div className="ch"><span className="ct">Review: Product card component</span><span className="badge b-bl">Sarah Kim</span></div>
        {items.map(it=>(
          <div className="rv-i" key={it.k}><span style={{fontSize:13}}>{it.l}</span>
            <div className="rv-dots">{[1,2,3,4,5].map(n=>(
              <div key={n} className={`rv-d ${sc[it.k]>=n?"on":""}`} onClick={()=>setSc(p=>({...p,[it.k]:n}))}>{n}</div>
            ))}</div>
          </div>
        ))}
        <div style={{marginTop:16}}><div style={{fontSize:12,color:"var(--text-3)",marginBottom:6}}>Comments</div><textarea className="input" rows={3} placeholder="Feedback on deliverable quality" style={{resize:"vertical"}}/></div>
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button className="btn btn-p" onClick={approve} disabled={!pending||done}>{done?"LER issued":"Approve & issue LER"}</button>
          <button className="btn btn-s" style={{borderColor:"var(--danger)",color:"var(--danger)"}} disabled={done}>Rejected</button>
        </div>
      </div>
    </div>
  </div>);
}

// ─── Maker Tasks (demo flow) ───
function MakerTasks({ user, flow, onSubmit, projects }) {
  const tasks = MOCK_TASKS.filter(t => t.assignee === user.name);
  const projName = (id) => projects.find(p => p.id === id)?.name || "—";
  const flowTask = tasks.find(t=>t.id===FLOW_TASK_ID);
  return (<div>
    <div className="ph"><h1>My tasks</h1><p>Assigned tasks · LER demo</p></div>
    <div className="pb">
      {flow===0&&(
        <div className="glass flow-card" style={{padding:16,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>LER demo task</div>
          <p style={{fontSize:12,color:"var(--text-2)",margin:"0 0 12px"}}>Submit below → Reviewer approval → LER badge issued.</p>
          <div className="sf">
            <div className="sf-s done"><span className="sf-d done">✓</span>Assigned</div><span className="sf-l done"/>
            <div className="sf-s cur"><span className="sf-d cur">2</span>Submit</div><span className="sf-l"/>
            <div className="sf-s"><span className="sf-d">3</span>Review</div><span className="sf-l"/>
            <div className="sf-s"><span className="sf-d">4</span>LER</div>
          </div>
        </div>
      )}
      {flow>=1&&(
        <div className="glass" style={{padding:14,marginBottom:16,background:"rgba(16,185,129,.1)",border:"1px solid rgba(16,185,129,.25)"}}>
          <span className="badge b-gr">Submitted</span> <span style={{fontSize:13,marginLeft:8}}>Awaiting Reviewer — switch role at the top.</span>
        </div>
      )}
      <div className="glass" style={{padding:20}}>
        <table><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Level</th><th>Due</th><th></th></tr></thead>
        <tbody>{tasks.map(t=>{
          const st = taskStatusForDemo(t, flow);
          const isFlow = t.id===FLOW_TASK_ID;
          return (
            <tr key={t.id} className={isFlow&&flow===0?"hl-demo":""}>
              <td style={{fontWeight:550}}>{t.name}</td>
              <td style={{ fontSize: 12, color: "var(--text-2)" }}>{projName(t.projectId)}</td>
              <td><StatusBadge s={st}/></td>
              <td><span className={`badge ${t.difficulty==="Hard"?"b-rd":"b-or"}`}>{t.difficulty}</span></td>
              <td style={{fontSize:12,color:"var(--text-2)"}}>{t.deadline}</td>
              <td>{isFlow&&flow===0&&<button className="btn btn-p btn-sm" onClick={onSubmit}>Submit work</button>}{isFlow&&flow>=1&&<span style={{fontSize:11,color:"var(--text-3)"}}>Submitted</span>}</td>
            </tr>
          );
        })}</tbody></table>
      </div>
    </div>
  </div>);
}

// ─── Mobile Nav ───
function MobileNav({page,onNav,items,onOut}) {
  var allItems = [];
  items.forEach(function(s){s.items.forEach(function(it){if(allItems.length<4)allItems.push(it)})});
  return (
    <div className="mob-nav">
      <div className="mob-nav-inner">
        {allItems.map(function(it){return(
          <div key={it.id} className={"mob-nav-item"+(page===it.id?" on":"")} onClick={function(){onNav(it.id)}}>
            {it.icon}<span>{it.name}</span>
          </div>
        )})}
        <div className="mob-nav-item" onClick={onOut}>{I.out}<span>Exit</span></div>
      </div>
    </div>
  );
}

// ─── App ───
function App() {
  const [role,setRole]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [selProj,setSelProj]=useState(null);
  const [flow,setFlow]=useState(0);
  const [tourIdx,setTourIdx]=useState(-1);
  const [projects,setProjects]=useState(()=>INITIAL_PROJECTS.map(p=>({...p})));
  const [projModal,setProjModal]=useState(false);
  const user=role?MOCK_USERS[role]:null;
  const clientLabel = user?.name || (user?.company ? `(주)${user.company}` : "LocalTech Inc.");

  const addProject = (form) => {
    setProjects(prev => [...prev, {
      id: "p" + Date.now(),
      name: form.name,
      client: form.client || clientLabel,
      status: "Assigning",
      progress: 0,
      deadline: form.deadline,
      security: form.security,
      budget: form.budget,
      tasks: 0,
      completedTasks: 0,
      modules: ["신규"],
      description: form.description || "",
    }]);
  };

  const openProjectModal = () => setProjModal(true);

  const goTour = (idx, opts) => {
    const i = Math.max(0, Math.min(idx, TOUR_STEPS.length - 1));
    setTourIdx(i);
    applyTourScene(i, setRole, setPage, setSelProj, opts);
  };

  const enterRole = (r) => {
    setFlow(0);
    setSelProj(null);
    setRole(r);
    if(r==="maker"||r==="reviewer") goTour(0, {keepRole:true});
    else { setTourIdx(-1); setPage("dashboard"); }
  };

  const startFlow = () => { setFlow(0); setRole("maker"); goTour(0); };
  const submitFlow = () => { setFlow(1); goTour(3); };
  const approveFlow = () => {
    setFlow(2);
    goTour(5);
    setTimeout(() => {
      const el = document.getElementById(DEMO_NEW_CRED.verifyId);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 400);
  };
  const switchDemoRole = (r) => {
    setRole(r);
    if(r==="reviewer"&&flow>=1) setPage("review");
    else if(r==="maker") setPage(flow>=2?"credentials":"tasks");
    else setPage("dashboard");
  };
  const tourAction = (act) => {
    if(act==="tasks") goTour(2);
    else if(act==="switchReviewer") { setFlow(f=>Math.max(f,1)); goTour(3); }
    else if(act==="review") goTour(4);
    else if(act==="credentials") goTour(5);
    else if(act==="done") setTourIdx(-1);
  };

  const navs={
    maker:[{items:[{id:"dashboard",name:"Dashboard",icon:I.home},{id:"tasks",name:"My tasks",icon:I.check,badge:2},{id:"credentials",name:"Credentials",icon:I.badge},{id:"portfolio",name:"Portfolio",icon:I.file}]}],
    reviewer:[{items:[{id:"dashboard",name:"Dashboard",icon:I.home},{id:"review",name:"Review queue",icon:I.check,badge:3},{id:"credentials",name:"Credentials",icon:I.badge}]}],
    client:[{items:[{id:"dashboard",name:"Dashboard",icon:I.home},{id:"projects",name:"Projects",icon:I.folder},{id:"talent",name:"Talent search",icon:I.search}]}],
    admin:[{label:"Operations",items:[{id:"dashboard",name:"Ops dashboard",icon:I.chart},{id:"projects",name:"Project admin",icon:I.folder},{id:"review",name:"Review queue",icon:I.badge}]},{label:"Admin",items:[{id:"users",name:"User admin",icon:I.users},{id:"talent",name:"Talent search",icon:I.search},{id:"credentials",name:"Credentials",icon:I.badge}]}],
  };

  const nav=id=>{setPage(id);setSelProj(null)};

  const displayFlow = tourDisplayFlow(tourIdx, flow);

  const renderPage=()=>{
    if(!user)return null;
    const projName = (id) => projects.find(p => p.id === id)?.name || "—";
    if(selProj)return <ProjectDetail project={selProj} onBack={()=>setSelProj(null)}/>;
    switch(page){
      case "dashboard":
        if(role==="admin") return <AdminDash projects={projects}/>;
        if(role==="client") return <ClientDash user={user} projects={projects} onCreate={openProjectModal}/>;
        if(role==="reviewer") return <ReviewerDash user={user} flow={displayFlow}/>;
        return <MakerDash user={user}/>;
      case "projects": return <Projects projects={projects} onSelect={setSelProj} onCreate={openProjectModal}/>;
      case "tasks": return role==="maker" ? <MakerTasks user={user} flow={displayFlow} onSubmit={submitFlow} projects={projects}/> : (<div><div className="ph"><h1>My tasks</h1><p>Manage assigned tasks</p></div><div className="pb"><div className="glass" style={{padding:20}}><table><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Level</th><th>Due</th></tr></thead><tbody>{(role==="admin"?MOCK_TASKS:MOCK_TASKS.filter(t=>t.assignee===user.name)).map(t=><tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td style={{fontSize:12,color:"var(--text-2)"}}>{projName(t.projectId)}</td><td><StatusBadge s={taskStatusForDemo(t,displayFlow)}/></td><td><span className={`badge ${t.difficulty==="Hard"?"b-rd":"b-or"}`}>{t.difficulty}</span></td><td style={{fontSize:12,color:"var(--text-2)"}}>{t.deadline}</td></tr>)}</tbody></table></div></div></div>);
      case "credentials": return <Creds flow={displayFlow} highlightId={displayFlow>=2?DEMO_NEW_CRED.verifyId:null}/>;
      case "portfolio": return <Portfolio user={user}/>;
      case "talent": return <TalentSearch/>;
      case "review": return <Review flow={displayFlow} onApprove={approveFlow}/>;
      case "users": return (<div><div className="ph"><h1>User admin</h1></div><div className="pb"><div className="glass" style={{padding:20}}><table><thead><tr><th>Name</th><th>Grade</th><th>Trust</th><th>Done</th><th>On-time</th><th>Region</th></tr></thead><tbody>{MOCK_TALENTS.map(t=><tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td><GradeBadge g={t.grade}/></td><td style={{fontFamily:"var(--mono)"}}>{t.trustScore}</td><td>{t.projects}</td><td>{t.deadlineRate}%</td><td>{t.region}</td></tr>)}</tbody></table></div></div></div>);
      default: return <MakerDash user={user}/>;
    }
  };

  if(!role)return(<><style>{css}</style><Login onLogin={enterRole} onStartFlow={startFlow}/></>);

  return (<><style>{css}</style>
    <div className="app">
      <Side user={user} page={page} onNav={nav} onOut={()=>{setRole(null);setPage("dashboard");setFlow(0);setTourIdx(-1)}} items={navs[role]||navs.maker}/>
      <div className="main">
        <DemoBanner flow={flow} role={role} onSwitchRole={switchDemoRole} onGoTasks={()=>goTour(2)} onGoReview={()=>{setFlow(f=>Math.max(f,1));goTour(4)}} onGoCreds={()=>goTour(5)} onOpenTour={()=>goTour(0)}/>
        {renderPage()}
      </div>
      <MobileNav page={page} onNav={nav} items={navs[role]||navs.maker} onOut={()=>{setRole(null);setPage("dashboard");setFlow(0);setTourIdx(-1)}}/>
      {tourIdx>=0&&<DemoTour tourIdx={tourIdx} flow={flow} onPrev={()=>goTour(tourIdx-1)} onNext={()=>goTour(tourIdx+1)} onGoTo={goTour} onSkip={()=>setTourIdx(-1)} onAction={tourAction}/>}
      <ProjectCreateModal open={projModal} onClose={()=>setProjModal(false)} onSubmit={addProject} clientLabel={clientLabel} />
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
