<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Role matching demo — GigCareer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="void 0"></script>
  <script src="js/gig-match-store.en.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--bg:#0c1220;--card:rgba(17,24,39,.85);--border:rgba(255,255,255,.1);--text:#e8eaef;--muted:rgba(232,234,239,.5);--warm:#d4a574;--green:#34d399;--purple:#a78bfa}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{color:var(--warm);text-decoration:none}
    .top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border);background:rgba(12,18,32,.95);position:sticky;top:0;z-index:50;flex-wrap:wrap}
    .logo{font-weight:700;font-size:15px}
    .beta{font-size:10px;background:var(--warm);color:#0c1220;padding:2px 6px;border-radius:4px;margin-left:6px}
    .lang{font-size:11px;color:var(--muted);margin-left:auto}
    .lang a{opacity:.5;margin:0 4px}
    .lang a.on{opacity:1;color:var(--warm)}
    .pill{padding:6px 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:transparent;color:var(--muted)}
    .pill.on{border-color:var(--warm);color:var(--warm);background:rgba(212,165,116,.12)}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:800px){.grid2{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
    .card h2{font-size:15px;margin-bottom:12px}
    .tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--border);margin:3px;cursor:pointer}
    .tag.on{background:rgba(212,165,116,.2);border-color:var(--warm);color:var(--warm)}
    .btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-p{background:linear-gradient(135deg,var(--warm),#e8b88a);color:#0c1220}
    .btn-s{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
    .btn-sm{padding:6px 12px;font-size:12px}
    .input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.25);color:var(--text);font-size:13px;margin-bottom:10px}
    .score{font-size:22px;font-weight:700;color:var(--green);font-family:monospace}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .gig-item{padding:14px 0;border-bottom:1px solid var(--border)}
    .gig-item:last-child{border-bottom:none}
    .muted{font-size:12px;color:var(--muted);line-height:1.6}
    .stars{color:#f59e0b;font-size:13px}
    .badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;text-transform:capitalize}
    .b-applied{background:rgba(59,130,246,.2);color:#93c5fd}
    .b-done{background:rgba(52,211,153,.2);color:var(--green)}
    .notice{font-size:12px;color:var(--purple);padding:12px;border-radius:8px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);margin-bottom:16px;line-height:1.65}
    .notice.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
    .toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;background:#1e293b;border:1px solid var(--border);border-radius:10px;font-size:13px;z-index:200;max-width:320px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:400px;width:100%}
    .loading{padding:40px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const ROLE_TAGS = ['Barista','Frontend','UX research','Translation','Event staff','Data cleanup','Video editing','Customer support','Marketing support','React','English OK'];
const REGIONS = ['Jeju','Busan','Daejeon','Sejong','Cheongju','Seoul','Remote'];
const DURATIONS = ['1 week','2 weeks','1 month','Flexible'];
const STATUS_LABEL = { applied: 'Applied', accepted: 'Accepted', rejected: 'Rejected', completed: 'Completed', open: 'Open', filled: 'Filled' };
const labelStatus = (s) => STATUS_LABEL[s] || s;

const store = new GigMatchStore();

function matchScore(worker, gig) {
  let s = 0;
  const overlap = (worker.tags||[]).filter(t => (gig.tags||[]).some(gt => gt.includes(t)||t.includes(gt)));
  s += overlap.length * 22;
  if ((worker.regions||[]).includes(gig.region) || gig.region==='Remote' || (worker.regions||[]).includes('Remote')) s += 28;
  if (worker.duration===gig.duration || gig.duration==='Flexible' || worker.duration==='Flexible') s += 12;
  s += (worker.rating||0)*5 + Math.min((worker.completed||0)*2, 14);
  return Math.round(Math.min(s, 100));
}

function TagPicker({ pool, selected, onToggle, label }) {
  return (
    <div style={{marginBottom:12}}>
      <div className="muted" style={{marginBottom:8}}>{label}</div>
      <div>{pool.map(t => (
        <span key={t} className={'tag' + (selected.includes(t) ? ' on' : '')} onClick={() => onToggle(t)}>{t}</span>
      ))}</div>
    </div>
  );
}

function WorkerApp({ db, refresh, storageMode, activeWorker, setActiveWorker, toast }) {
  const [tab, setTab] = useState('gigs');
  const [filter, setFilter] = useState('');
  const [busy, setBusy] = useState(false);
  const w = db.workers.find(x => x.id === activeWorker) || db.workers[0];

  const rankedGigs = useMemo(() => {
    let list = db.gigs.filter(g => g.status === 'open');
    if (filter) list = list.filter(g => g.region.includes(filter) || g.title.includes(filter) || (g.tags||[]).some(t => t.includes(filter)));
    return list.map(g => ({ ...g, score: matchScore(w, g) })).sort((a, b) => b.score - a.score);
  }, [db.gigs, w, filter]);

  const myApps = db.applications.filter(a => a.workerId === w.id);

  const run = async (fn) => { setBusy(true); try { await fn(); await refresh(); } catch(e) { toast('Error: '+e.message); } setBusy(false); };

  const patchWorker = (patch) => run(() => store.updateWorker({ ...w, ...patch }));
  const apply = (gig, withAi) => run(() => store.apply(w.id, gig.id, withAi));
  const toggleTag = (t) => patchWorker({ tags: (w.tags||[]).includes(t) ? w.tags.filter(x=>x!==t) : [...(w.tags||[]), t] });
  const toggleRegion = (r) => patchWorker({ regions: (w.regions||[]).includes(r) ? w.regions.filter(x=>x!==r) : [...(w.regions||[]), r] });

  return (
    <div className="wrap">
      <div className={'notice' + (storageMode==='cloud'?' ok':'')}>
        <b>{storageMode==='cloud'?'Supabase connected':'Local demo'}</b> — Tag matching · AI-tailored apply · Post-gig reviews (LER verification layer ships later)
      </div>
      <div className="row" style={{marginBottom:16}}>
        <div>
          <h1 style={{fontSize:20}}>Talent · {w.name}</h1>
          <p className="muted">Rating {w.rating} · {w.completed} gigs done · {w.tags?.slice(0,3).join(', ')}</p>
        </div>
        <div>
          {['gigs','profile','apps'].map(t => (
            <button key={t} className={'pill'+(tab===t?' on':'')} onClick={()=>setTab(t)}>
              {t==='gigs'?'Matched gigs':t==='profile'?'Profile':'Applications'}
            </button>
          ))}
        </div>
      </div>

      {tab==='profile'&&(
        <div className="card">
          <h2>Profile (used for matching)</h2>
          <TagPicker pool={ROLE_TAGS} selected={w.tags||[]} onToggle={toggleTag} label="Role tags" />
          <TagPicker pool={REGIONS} selected={w.regions||[]} onToggle={toggleRegion} label="Available regions" />
          <div className="muted" style={{marginBottom:8}}>Availability (click to save)</div>
          {DURATIONS.map(d=><span key={d} className={'tag'+(w.duration===d?' on':'')} onClick={()=>patchWorker({ duration:d })}>{d}</span>)}
        </div>
      )}

      {tab==='gigs'&&(
        <>
          <input className="input" placeholder="Filter by region or keyword (e.g. Jeju, React)" value={filter} onChange={e=>setFilter(e.target.value)} />
          <div className="card">
            <h2>Gigs ranked by match score</h2>
            {rankedGigs.map(g=>{
              const applied = myApps.find(a=>a.gigId===g.id&&a.status!=='rejected');
              return (
                <div key={g.id} className="gig-item">
                  <div className="row">
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600}}>{g.title}</div>
                      <div className="muted">{g.employer} · {g.region} · {g.duration} · {g.pay}</div>
                      <div style={{marginTop:6}}>{(g.tags||[]).map(t=><span key={t} className="tag">{t}</span>)}</div>
                      {g.jdText&&<p className="muted" style={{marginTop:8}}>{g.jdText}</p>}
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div className="score">{g.score}%</div>
                      {applied ? <span className="badge b-applied">{labelStatus(applied.status)}</span> : (
                        <>
                          <button className="btn btn-p btn-sm" style={{marginTop:6,display:'block'}} disabled={busy} onClick={()=>apply(g,false)}>Apply</button>
                          <button className="btn btn-s btn-sm" style={{marginTop:4,display:'block'}} disabled={busy} onClick={()=>apply(g,true)}>AI-tailored apply</button>
                        </>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}

      {tab==='apps'&&(
        <div className="card">
          <h2>Applications · AI summaries</h2>
          {myApps.length===0&&<p className="muted">No applications yet.</p>}
          {myApps.map(a=>{
            const g = db.gigs.find(x=>x.id===a.gigId);
            return (
              <div key={a.id} className="gig-item">
                <div style={{fontWeight:600}}>{g?.title} · {g?.employer}</div>
                <div className="muted">Match {a.matchScore}% · {labelStatus(a.status)}</div>
                {a.tailoredSummary&&<p style={{fontSize:12,marginTop:8,padding:10,background:'rgba(139,92,246,.1)',borderRadius:8,lineHeight:1.6}}>{a.tailoredSummary}</p>}
                {a.employerReview&&<p className="muted" style={{marginTop:6}}>Employer review: ★{a.employerReview.rating} {a.employerReview.text}</p>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ReviewModal({ onClose, onSubmit }) {
  const [rating, setRating] = useState(5);
  const [text, setText] = useState('');
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2 style={{fontSize:16,marginBottom:12}}>Complete gig · Review</h2>
        <div className="muted" style={{marginBottom:10}}>Rating (1–5)</div>
        {[1,2,3,4,5].map(n=><span key={n} className={'tag'+(rating===n?' on':'')} onClick={()=>setRating(n)}>★{n}</span>)}
        <textarea className="input" rows={3} placeholder="Short comment" value={text} onChange={e=>setText(e.target.value)} style={{marginTop:12}}/>
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <button className="btn btn-p" onClick={()=>onSubmit({ rating, text })}>Mark completed</button>
          <button className="btn btn-s" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function EmployerApp({ db, refresh, storageMode, toast }) {
  const [form, setForm] = useState({ title:'', employer:'', tags:[], region:'Jeju', duration:'2 weeks', pay:'', jdText:'' });
  const [pickGig, setPickGig] = useState(null);
  const [reviewApp, setReviewApp] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async (fn) => { setBusy(true); try { await fn(); await refresh(); toast('Saved'); } catch(e) { toast('Error: '+e.message); } setBusy(false); };

  const postGig = () => {
    if (!form.title || !form.employer) return toast('Title and company are required');
    run(async () => { await store.postGig(form); setForm({ title:'', employer:'', tags:[], region:'Jeju', duration:'2 weeks', pay:'', jdText:'' }); });
  };

  const appsFor = (gigId) => db.applications.filter(a => a.gigId === gigId)
    .map(a => ({ ...a, worker: db.workers.find(w => w.id === a.workerId) }))
    .sort((a, b) => b.matchScore - a.matchScore);

  const selectedGig = pickGig ? db.gigs.find(g => g.id === pickGig) : null;

  return (
    <div className="wrap">
      <div className={'notice'+(storageMode==='cloud'?' ok':'')}>
        <b>Employer</b> — Post a JD → Applicants ranked by tags → Accept/reject → Reviews update talent ratings
      </div>
      <div className="grid2">
        <div className="card">
          <h2>Post a gig + JD (for AI apply)</h2>
          <input className="input" placeholder="Job title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} />
          <input className="input" placeholder="Company name" value={form.employer} onChange={e=>setForm({...form,employer:e.target.value})} />
          <input className="input" placeholder="Pay (e.g. hourly rate)" value={form.pay} onChange={e=>setForm({...form,pay:e.target.value})} />
          <textarea className="input" rows={3} placeholder="Job description text — used for AI-tailored applications" value={form.jdText} onChange={e=>setForm({...form,jdText:e.target.value})} />
          <TagPicker pool={ROLE_TAGS} selected={form.tags} onToggle={t=>setForm(f=>({...f,tags:f.tags.includes(t)?f.tags.filter(x=>x!==t):[...f.tags,t]}))} label="Required role tags" />
          <TagPicker pool={REGIONS} selected={[form.region]} onToggle={r=>setForm({...form,region:r})} label="Region" />
          {DURATIONS.map(d=><span key={d} className={'tag'+(form.duration===d?' on':'')} onClick={()=>setForm({...form,duration:d})}>{d}</span>)}
          <button className="btn btn-p" style={{marginTop:12}} disabled={busy} onClick={postGig}>Publish gig</button>
        </div>
        <div className="card">
          <h2>My postings</h2>
          {db.gigs.map(g=>(
            <div key={g.id} className="gig-item">
              <div className="row">
                <div><div style={{fontWeight:600}}>{g.title}</div><div className="muted">{labelStatus(g.status)} · {appsFor(g.id).length} applicants</div></div>
                <button className="btn btn-s btn-sm" onClick={()=>setPickGig(g.id)}>Applicants</button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {selectedGig&&(
        <div className="card">
          <h2>Applicants — {selectedGig.title}</h2>
          {appsFor(selectedGig.id).map(a=>(
            <div key={a.id} className="gig-item">
              <div className="row">
                <div style={{flex:1}}>
                  <div style={{fontWeight:600}}>{a.worker?.name}</div>
                  <div className="muted">{(a.worker?.tags||[]).join(' · ')}</div>
                  <div className="stars">★ {a.worker?.rating} · {a.worker?.completed} gigs</div>
                  {a.tailoredSummary&&<p style={{fontSize:11,marginTop:8,color:'#c4b5fd'}}>{a.tailoredSummary}</p>}
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="score">{a.matchScore}%</div>
                  {a.status==='applied'&&<>
                    <button className="btn btn-p btn-sm" style={{marginTop:4}} disabled={busy} onClick={()=>run(()=>store.setApplicationStatus(a.id,'accepted'))}>Accept</button>
                    <button className="btn btn-s btn-sm" style={{marginTop:4}} disabled={busy} onClick={()=>run(()=>store.setApplicationStatus(a.id,'rejected'))}>Reject</button>
                  </>}
                  {a.status==='accepted'&&<button className="btn btn-p btn-sm" style={{marginTop:4}} onClick={()=>setReviewApp(a)}>Complete · review</button>}
                  {a.status==='completed'&&<span className="badge b-done">Completed</span>}
                </div>
              </div>
            </div>
          ))}
          <button className="btn btn-s btn-sm" style={{marginTop:8}} onClick={()=>setPickGig(null)}>Close</button>
        </div>
      )}

      {reviewApp&&(
        <ReviewModal
          onClose={()=>setReviewApp(null)}
          onSubmit={(rev)=>run(async()=>{
            await store.setApplicationStatus(reviewApp.id,'completed',{
              workerId: reviewApp.workerId,
              employerReview: rev,
              workerReview: { rating: rev.rating, text: 'Collaborated smoothly with the employer.' },
            });
            setReviewApp(null);
          })}
        />
      )}
    </div>
  );
}

function App() {
  const [db, setDb] = useState(null);
  const [mode, setMode] = useState(null);
  const [activeWorker, setActiveWorker] = useState(null);
  const [storageMode, setStorageMode] = useState('local');
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState('');

  const refresh = useCallback(async () => {
    const data = await store.load();
    setDb(data);
    if (data.workers?.length && !activeWorker) setActiveWorker(data.workers[0].id);
    return data;
  }, [activeWorker]);

  useEffect(() => {
    (async () => {
      const { mode: m } = await store.init();
      setStorageMode(m);
      await refresh();
      setLoading(false);
    })();
    return store.subscribe(() => { refresh(); });
  }, []);

  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(''), 2800); };

  const reset = async () => {
    const data = await store.reset();
    setDb(data);
    setMode(null);
    toast('Data reset');
  };

  const addWorker = async () => {
    const name = prompt('New talent profile name');
    if (!name) return;
    const { workerId } = await store.createWorker(name);
    setActiveWorker(workerId);
    await refresh();
    toast(name + ' added');
  };

  if (loading) return <div className="loading">Connecting…</div>;

  if (!mode) {
    return (
      <>
        <header className="top">
          <a href="index.html" className="logo">GigCareer <span className="beta">BETA</span></a>
          <span className="muted">Matching v1 · {storageMode==='cloud'?'Supabase':'localStorage'}</span>
          <span className="lang"><a href="../ko/gig-match.html">KR</a><span>|</span><a href="gig-match.html" className="on">EN</a></span>
        </header>
        <div className="wrap" style={{paddingTop:40,maxWidth:520,margin:'0 auto'}}>
          <h1 style={{fontSize:26,marginBottom:12}}>Role tag matching</h1>
          <p className="muted" style={{marginBottom:20,lineHeight:1.7}}>
            STEP 1 Profiles & gigs · STEP 2 Tag matching · STEP 3 Reviews & reputation.<br/>
            LER verification connects as a premium layer later.
          </p>
          <button className="btn btn-p" style={{width:'100%',marginBottom:8}} onClick={()=>setMode('worker')}>Talent (gig worker)</button>
          <button className="btn btn-s" style={{width:'100%',marginBottom:8}} onClick={()=>setMode('employer')}>Employer (post gigs)</button>
          <button className="btn btn-s" style={{width:'100%',marginBottom:8}} onClick={addWorker}>+ New talent profile</button>
          <a href="localcrew-mvp.html" className="muted" style={{display:'block',marginTop:16}}>LER platform demo →</a>
          <p className="muted" style={{marginTop:20,fontSize:11}}>Supabase: copy config.example.js → config.js, then run schema.sql</p>
          <button className="btn btn-s btn-sm" style={{marginTop:12}} onClick={reset}>Reset all data</button>
        </div>
        {msg&&<div className="toast">{msg}</div>}
      </>
    );
  }

  if (!db) return null;

  return (
    <>
      <header className="top">
        <a href="index.html" className="logo">GigCareer</a>
        <span className="muted">{storageMode==='cloud'?'☁ Supabase':'💾 Local'}</span>
        <span className="lang"><a href="../ko/gig-match.html">KR</a><span>|</span><a href="gig-match.html" className="on">EN</a></span>
        <button className="pill" onClick={()=>setMode(null)}>← Home</button>
        {mode==='worker'&&db.workers.map(w=>(
          <button key={w.id} className={'pill'+(activeWorker===w.id?' on':'')} onClick={()=>setActiveWorker(w.id)}>{w.name}</button>
        ))}
        <button className="pill" onClick={refresh}>Refresh</button>
        <button className="pill" onClick={reset}>Reset</button>
      </header>
      {mode==='worker'
        ? <WorkerApp db={db} refresh={refresh} storageMode={storageMode} activeWorker={activeWorker} setActiveWorker={setActiveWorker} toast={toast} />
        : <EmployerApp db={db} refresh={refresh} storageMode={storageMode} toast={toast} />}
      {msg&&<div className="toast">{msg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
