// ─── Glassmorphism CSS ───
const css = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --bg-deep: #0C1220;
  --bg-surface: rgba(17,24,39,0.85);
  --glass-1: rgba(255,255,255,0.08);
  --glass-2: rgba(255,255,255,0.05);
  --glass-3: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.12);
  --glass-highlight: rgba(255,255,255,0.20);
  --glass-blur: 40px;
  --accent: #3B82F6;
  --accent-warm: #D4A574;
  --accent-glow: rgba(212,165,116,0.25);
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --purple: #8B5CF6;
  --text-1: #F1F5F9;
  --text-2: #94A3B8;
  --text-3: #64748B;
  --border: rgba(255,255,255,0.08);
  --font: 'Noto Sans KR', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-1);overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 15px var(--accent-glow)}50%{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(212,165,116,0.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp .4s ease-out both}

/* ─── Glass Card System ─── */
.glass{
  background:var(--glass-1);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);
  border-radius:16px;
  box-shadow:
    inset -1px -1px 3px rgba(0,0,0,1),
    20px 20px 20px rgba(0,0,0,0.2),
    inset 0 -10px 4px rgba(255,255,255,0.06),
    inset 0 4px 10px rgba(0,0,0,0.25);
  position:relative;
  overflow:hidden;
}
.glass::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-highlight),transparent);
}
.glass-2{
  background:var(--glass-2);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);border-radius:12px;
  box-shadow:inset -1px -1px 2px rgba(0,0,0,0.6),8px 8px 16px rgba(0,0,0,0.15),inset 0 -6px 3px rgba(255,255,255,0.04),inset 0 2px 6px rgba(0,0,0,0.2);
  position:relative;overflow:hidden;
}
.glass-2::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent)}
.glass-3{
  background:var(--glass-3);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.05);border-radius:10px;
}

/* ─── Layout ─── */

  background-image:radial-gradient(ellipse at 20% 50%,rgba(59,130,246,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(212,165,116,0.05) 0%,transparent 40%),radial-gradient(ellipse at 50% 90%,rgba(139,92,246,0.04) 0%,transparent 40%);
}
.side{width:260px;background:rgba(17,24,39,0.6);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.side-head{padding:24px 20px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-0.5px}
.logo-m{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent-warm),#E8B88A);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0C1220;box-shadow:0 0 20px var(--accent-glow)}
.side-nav{flex:1;padding:12px;overflow-y:auto}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);padding:12px 12px 4px}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-2);cursor:pointer;transition:all .2s;font-size:13px;font-weight:450;margin-bottom:2px}
.nav-i:hover{background:var(--glass-2);color:var(--text-1)}
.nav-i.on{background:rgba(212,165,116,0.12);color:var(--accent-warm);font-weight:600}
.nav-i .nb{margin-left:auto;background:var(--accent-warm);color:#0C1220;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center}
.side-foot{padding:16px;border-top:1px solid var(--border)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px}

.main{flex:1;overflow-y:auto;overflow-x:hidden}
.ph{padding:28px 36px 20px;position:sticky;top:0;z-index:10;background:rgba(12,18,32,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.ph p{font-size:13px;color:var(--text-2);margin-top:4px}
.pb{padding:24px 36px 48px}

/* ─── Components ─── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:20px;position:relative}
.stat::after{content:'';position:absolute;top:0;left:20px;right:20px;height:2px;border-radius:1px}
.stat.bl::after{background:var(--accent)}.stat.gr::after{background:var(--success)}.stat.pu::after{background:var(--purple)}.stat.or::after{background:var(--accent-warm)}
.stat-l{font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.stat-v{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.stat-s{font-size:11px;color:var(--text-2);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-bl{background:rgba(59,130,246,0.15);color:#60A5FA}
.b-gr{background:rgba(16,185,129,0.15);color:#34D399}
.b-or{background:rgba(245,158,11,0.15);color:#FBBF24}
.b-pu{background:rgba(139,92,246,0.15);color:#A78BFA}
.b-rd{background:rgba(239,68,68,0.15);color:#F87171}
.b-gy{background:rgba(100,116,139,0.15);color:var(--text-3)}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;background:var(--glass-2);color:var(--text-2);border:1px solid var(--border);margin:2px}
.pbar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .6s ease}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:550;border:none;cursor:pointer;transition:all .2s;font-family:var(--font)}
.btn-p{background:linear-gradient(135deg,var(--accent-warm),#C8956C);color:#0C1220;box-shadow:0 0 20px var(--accent-glow)}
.btn-p:hover{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(212,165,116,0.15);transform:translateY(-1px)}
.btn-s{background:var(--glass-2);color:var(--text-1);border:1px solid var(--glass-border);backdrop-filter:blur(10px)}
.btn-s:hover{background:var(--glass-1);border-color:var(--glass-highlight)}
.btn-g{background:transparent;color:var(--text-2);border:none}.btn-g:hover{color:var(--text-1)}
.btn-sm{padding:5px 10px;font-size:12px}
.input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--text-1);width:100%;font-family:var(--font);outline:none;transition:all .2s}
.input:focus{border-color:var(--accent-warm);box-shadow:0 0 0 3px rgba(212,165,116,0.15)}
.input::placeholder{color:var(--text-3)}
select.input{cursor:pointer;appearance:none}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;vertical-align:middle}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Login */
@keyframes orbFloat1{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes orbFloat2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes logoGlow{0%,100%{box-shadow:0 0 20px rgba(212,165,116,0.3)}50%{box-shadow:0 0 35px rgba(212,165,116,0.5)}}
.login{min-height:100vh;position:relative;overflow:hidden;background:var(--bg-deep);background-image:radial-gradient(ellipse at 15% 50%,rgba(59,130,246,0.07) 0%,transparent 50%),radial-gradient(ellipse at 85% 30%,rgba(212,165,116,0.06) 0%,transparent 45%),radial-gradient(ellipse at 50% 90%,rgba(139,92,246,0.04) 0%,transparent 40%)}
.login .orb{position:absolute;border-radius:50%;pointer-events:none}
.login .orb1{width:280px;height:280px;top:-5%;left:-5%;background:radial-gradient(circle,rgba(59,130,246,0.25),transparent 70%);filter:blur(60px);animation:orbFloat1 14s ease-in-out infinite}
.login .orb2{width:200px;height:200px;bottom:10%;right:-3%;background:radial-gradient(circle,rgba(212,165,116,0.3),transparent 70%);filter:blur(50px);animation:orbFloat2 18s ease-in-out infinite}
.login .orb3{width:160px;height:160px;top:40%;left:55%;background:radial-gradient(circle,rgba(139,92,246,0.2),transparent 70%);filter:blur(45px);animation:orbFloat1 16s ease-in-out infinite}
.login-inner{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;max-width:1100px;margin:0 auto;padding:0 40px;min-height:100vh}
.login-hero{padding:40px 0}
.login-hero .logo-m{animation:logoGlow 3s ease-in-out infinite}
.lh-title{font-size:clamp(28px,3.5vw,42px);font-weight:800;line-height:1.25;letter-spacing:-1px;margin:20px 0 14px}
.lh-title em{font-style:normal;background:linear-gradient(135deg,var(--accent-warm),#E8B88A);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lh-sub{font-size:14px;line-height:1.7;color:var(--text-2);max-width:400px;margin-bottom:24px}
.lh-nums{display:flex;gap:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.06)}
.lh-n{font-size:20px;font-weight:800;font-family:var(--mono);letter-spacing:-0.5px}
.lh-l{font-size:11px;color:var(--text-3);margin-top:2px}
.login-card{padding:36px 32px;width:100%;max-width:440px}
.lc-t{font-size:20px;font-weight:700;margin-bottom:4px;text-align:center}
.lc-s{font-size:13px;color:var(--text-2);text-align:center;margin-bottom:24px}
.lc-micro{font-size:11px;color:var(--text-3);text-align:center;margin-top:12px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.role{padding:16px 12px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .25s;text-align:center;background:var(--glass-3)}
.role:hover{border-color:var(--glass-highlight);background:var(--glass-2);transform:translateY(-2px)}
.role.sel{border-color:var(--accent-warm);background:rgba(212,165,116,0.1);box-shadow:0 0 20px var(--accent-glow);transform:translateY(-2px)}
.role .ri{font-size:24px;margin-bottom:6px}
.role .rn{font-size:13px;font-weight:600}
.role .rd{font-size:10px;color:var(--text-3);margin-top:2px}
/* Mobile Bottom Nav */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(12,18,32,0.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.mob-nav-inner{display:flex;justify-content:space-around;align-items:center;max-width:500px;margin:0 auto}
.mob-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--text-3);min-width:48px;position:relative}
.mob-nav-item span{font-size:9px;font-weight:500;white-space:nowrap}
.mob-nav-item:hover,.mob-nav-item.on{color:var(--accent-warm)}
.mob-nav-item.on{background:rgba(212,165,116,0.1)}
.mob-nav-item svg{width:20px;height:20px}

/* Review dots */
.rv-i{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.rv-dots{display:flex;gap:4px}
.rv-d{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text-3)}
.rv-d.on{border-color:var(--accent-warm);background:var(--accent-warm);color:#0C1220}

/* Status flow */
.sf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.sf-s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.sf-s.done{color:var(--success)}.sf-s.cur{color:var(--accent-warm);font-weight:600}
.sf-d{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px}
.sf-d.done{background:var(--success);border-color:var(--success);color:white}
.sf-d.cur{border-color:var(--accent-warm);animation:glowPulse 2s infinite}
.sf-l{width:24px;height:2px;background:rgba(255,255,255,0.08)}.sf-l.done{background:var(--success)}

/* Portfolio */
.port{padding:32px;max-width:700px}
.port-sec{margin-bottom:24px}
.port-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent-warm);margin-bottom:12px;font-weight:600}

@media(max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.login-inner{grid-template-columns:1fr;gap:24px;padding:80px 24px 40px;min-height:auto}.login-hero{text-align:center;padding:0}.login-hero .logo{justify-content:center}.lh-sub{margin:0 auto 24px}.lh-nums{justify-content:center}.login-card{max-width:100%;margin:0 auto}}
@media(max-width:768px){.side{display:none}.mob-nav{display:block}.stats{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.pb{padding:16px 16px 90px}.ph{padding:18px 16px 14px}.ph h1{font-size:18px}.main{padding-bottom:0}}
@media(max-width:480px){.login-inner{padding:60px 16px 32px}.roles{gap:8px}.role{padding:14px 8px}.login-card{padding:28px 20px}.stats{grid-template-columns:1fr}}
.demo-bar{position:sticky;top:0;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;background:linear-gradient(90deg,rgba(212,165,116,.18),rgba(139,92,246,.12));border-bottom:1px solid rgba(212,165,116,.25);font-size:12px}
.demo-bar strong{color:var(--accent-warm);font-weight:600}
.demo-bar .flow-pills{display:flex;gap:6px;flex-wrap:wrap}
.demo-bar .fp{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--text-3);font-size:11px}
.demo-bar .fp.on{background:rgba(212,165,116,.25);color:var(--accent-warm);font-weight:600}
.demo-role-sw{display:flex;gap:6px;align-items:center}
.demo-role-sw button{padding:5px 10px;font-size:11px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-2);cursor:pointer}
.demo-role-sw button.on{border-color:var(--accent-warm);color:var(--accent-warm)}
.tour-ov{position:fixed;inset:0;z-index:200;background:rgba(4,8,18,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.tour-box{max-width:420px;width:100%;padding:28px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.tour-box h3{margin:0 0 10px;font-size:18px}
.tour-box p{margin:0 0 20px;font-size:13px;color:var(--text-2);line-height:1.65}
.tour-dots{display:flex;gap:6px;margin-bottom:18px}
.tour-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.tour-dots span.on{background:var(--accent-warm)}
.hl-demo{outline:2px solid var(--accent-warm);outline-offset:3px;border-radius:8px;animation:demoPulse 2s ease infinite}
@keyframes demoPulse{0%,100%{outline-color:rgba(212,165,116,.5)}50%{outline-color:rgba(212,165,116,1)}}
.flow-card{border:1px solid rgba(212,165,116,.35);background:rgba(212,165,116,.08)!important}
.ler-new{animation:lerPop .5s ease}
@keyframes lerPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
`;

// ─── Helpers ───
const StatusBadge = ({s}) => {
  const m = {"In progress":"bl","In review":"or","Assigning":"pu","Done":"gr","Assigned":"pu","Submitted":"or","Approved":"gr","Revision":"rd","Rejected":"rd","Standard":"bl","High":"or"};
  return <span className={`badge b-${m[s]||"gy"}`}>{s}</span>;
};
const GradeBadge = ({g}) => <span className="badge" style={{background:`${gradeColors[g]}22`,color:gradeColors[g]}}>{g}</span>;
const Stars = ({v}) => <span style={{display:"inline-flex",alignItems:"center",gap:2}}>{I.star}<span style={{fontFamily:"var(--mono)",fontWeight:600,fontSize:13}}>{v}</span></span>;
const PBar = ({v,c="var(--accent-warm)"}) => <div className="pbar"><div className="pfill" style={{width:`${v}%`,background:c}}/></div>;

// ─── Demo UI ───
function DemoBanner({flow, role, onSwitchRole, onGoTasks, onGoReview, onGoCreds}) {
  const steps = [
    {n:1,l:"Submit",done:flow>=1},
    {n:2,l:"Review",done:flow>=2},
    {n:3,l:"LER issued",done:flow>=2},
    {n:4,l:"Verify",done:flow>=2},
  ];
  return (
    <div className="demo-bar">
      <div>
        <strong>Demo</strong> · Sample data · No login
        <span style={{marginLeft:8,color:"var(--text-3)"}}>LER issuance flow</span>
      </div>
      <div className="flow-pills">{steps.map(s=><span key={s.n} className={"fp"+(s.done?" on":"")}>{s.n}. {s.l}</span>)}</div>
      <div className="demo-role-sw">
        <span style={{color:"var(--text-3)",fontSize:11}}>Switch role</span>
        {["maker","reviewer"].map(r=>(
          <button key={r} className={role===r?"on":""} onClick={()=>onSwitchRole(r)}>{r==="maker"?"Maker":"Reviewer"}</button>
        ))}
        {flow===0&&role==="maker"&&<button className="btn btn-p btn-sm" onClick={onGoTasks}>① Submit task</button>}
        {flow===1&&role==="reviewer"&&<button className="btn btn-p btn-sm" onClick={onGoReview}>② Approve</button>}
        {flow>=2&&<button className="btn btn-p btn-sm" onClick={onGoCreds}>③ View LER</button>}
      </div>
    </div>
  );
}

function DemoTour({step, role, flow, onNext, onSkip, onAction}) {
  if(!step) return null;
  const makerSteps = [
    {t:"Welcome to the LER demo",b:"Click through Maker → Reviewer to issue a verified LER badge. No login or payment.",a:"Start"},
    {t:"Step 1 · Submit deliverable",b:"Open My tasks and click Submit on Product card component.",a:"Go to tasks"},
    {t:"Step 2 · Switch to Reviewer",b:"After submit, use Switch role → Reviewer, then Approve.",a:"Switch to Reviewer"},
  ];
  const reviewerSteps = [
    {t:"Step 3 · Approve review",b:"On Review queue, click Approve to generate LER data.",a:"Go to review"},
    {t:"Step 4 · View LER",b:"Open Credentials and check the new Verify ID (VRF-…). Proof-of-work, not a resume.",a:"View credentials"},
    {t:"Demo complete",b:"Enterprises use Talent search with the same verified history. Explore other roles freely.",a:"Done"},
  ];
  const list = role==="reviewer"||flow>=1 ? reviewerSteps : makerSteps;
  const idx = Math.min(step-1, list.length-1);
  const cur = list[idx];
  const go = () => {
    if(step===2&&role==="maker") onAction("tasks");
    else if(step===3&&flow>=1) onAction("switchReviewer");
    else if(cur.t.includes("Review")) onAction("review");
    else if(cur.t.includes("LER")) onAction("credentials");
    else onNext();
  };
  return (
    <div className="tour-ov" onClick={onSkip}>
      <div className="tour-box" onClick={e=>e.stopPropagation()}>
        <div className="tour-dots">{list.map((_,i)=><span key={i} className={i===idx?"on":""}/>)}</div>
        <h3>{cur.t}</h3>
        <p>{cur.b}</p>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-p" onClick={go}>{cur.a}</button>
          <button className="btn btn-s" onClick={onSkip}>Skip</button>
        </div>
      </div>
    </div>
  );
}

// ─── Login ───
function Login({onLogin, onStartFlow}) {
  const [sel,setSel] = useState(null);
  const roles = [
    {k:"maker",i:"\u{1F6E0}\uFE0F",n:"Maker",d:"Talent"},
    {k:"reviewer",i:"\u{1F50D}",n:"Reviewer",d:"Project Assessor"},
    {k:"client",i:"\u{1F3E2}",n:"Client",d:"Enterprise Client"},
    {k:"admin",i:"\u2699\uFE0F",n:"Admin/PM",d:"Platform Admin"},
  ];
  return (
    <div className="login">
      <div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/>
      <div className="login-inner">
        <div className="login-hero">
          <div className="logo"><div className="logo-m">L</div><span style={{background:'linear-gradient(135deg,var(--accent-warm),#E8B88A)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>LocalCrew</span></div>
          <h1 className="lh-title">Regional project work,<br/><em>verified credentials</em></h1>
          <p className="lh-sub">Connect regional project work to real opportunities through verified history, micro-credentials, and auto portfolios.</p>
          <div className="lh-nums">
            {[["240+","Tasks completed"],["96%","On-time rate"],["47","Credentials issued"]].map(function(arr){return <div key={arr[1]}><div className="lh-n">{arr[0]}</div><div className="lh-l">{arr[1]}</div></div>})}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'center'}}>
          <div className="login-card glass">
            <div className="lc-t">Try demo</div>
            <div className="lc-s">Choose a role to enter the dashboard</div>
            <div className="roles">
              {roles.map(function(r){return(
                <div key={r.k} className={"role"+(sel===r.k?" sel":"")} onClick={function(){setSel(r.k)}}>
                  <div className="ri">{r.i}</div><div className="rn">{r.n}</div><div className="rd">{r.d}</div>
                </div>
              )})}
            </div>
            <button className="btn btn-p" style={{width:"100%",justifyContent:"center",padding:13,fontSize:14}} disabled={!sel} onClick={function(){if(sel)onLogin(sel)}}>
              {sel ? roles.find(function(r){return r.k===sel}).n+" dashboard" : "Select a role"}
            </button>
            <div className="lc-micro">Preview key screens without signing in</div>
            <button type="button" className="btn btn-s" style={{width:"100%",marginTop:12,justifyContent:"center"}} onClick={onStartFlow}>
              Try LER flow (2 min) →
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Sidebar ───
function Side({user,page,onNav,onOut,items}) {
  const bg = {Maker:"linear-gradient(135deg,#D4A574,#E8B88A)",Reviewer:"linear-gradient(135deg,#10B981,#34D399)",Client:"linear-gradient(135deg,#8B5CF6,#A78BFA)",Admin:"linear-gradient(135deg,#EF4444,#F87171)"};
  return (
    <div className="side">
      <div className="side-head"><div className="logo"><div className="logo-m">L</div>LocalCrew</div></div>
      <nav className="side-nav">
        {items.map((sec,si) => (
          <div key={si}>
            {sec.label && <div className="nav-label">{sec.label}</div>}
            {sec.items.map(it => (
              <div key={it.id} className={`nav-i ${page===it.id?"on":""}`} onClick={()=>onNav(it.id)}>
                {it.icon}<span>{it.name}</span>
                {it.badge && <span className="nb">{it.badge}</span>}
              </div>
            ))}
          </div>
        ))}
      </nav>
      <div className="side-foot">
        <div className="side-user">
          <div className="avatar" style={{background:bg[user.role]}}>{(user.name||"?")[0]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div>
            <div style={{fontSize:11,color:"var(--text-3)"}}>{user.role}{user.grade?` · ${user.grade}`:""}</div>
          </div>
          <div style={{cursor:"pointer",color:"var(--text-3)"}} onClick={onOut}>{I.out}</div>
        </div>
      </div>
    </div>
  );
}

// ─── Maker Dashboard ───

      <div className="stats">
        {[["Trust score",user.trustScore,"Top 18%","bl"],["Total badges",user.badges,"+2 this month","pu"],["On-time rate",`${user.deadlineRate}%`,"Last 10 tasks","gr"],["Avg rating",user.avgRating,"Reviewer score","or"]].map(([l,v,s,c],i) => (
          <div key={i} className={`glass stat ${c} fade-up`} style={{animationDelay:`${i*0.06}s`}}>
            <div className="stat-l">{l}</div>
            <div className="stat-v" style={{color:c==="bl"?"#60A5FA":c==="gr"?"#34D399":c==="pu"?"#A78BFA":"var(--accent-warm)"}}>{v}</div>

          </div>
        ))}
      </div>

// ─── Credentials ───

  return (<div>
    <div className="ph"><h1>Micro-credentials</h1><p>Verified work badges {list.length} {flow>=2&&<span className="badge b-gr" style={{marginLeft:8}}>LER just issued</span>}</p></div>
    {flow>=2&&(
      <div className="pb" style={{paddingTop:0}}>
        <div className="glass flow-card ler-new" style={{padding:16,marginBottom:16}}>
          <div style={{fontSize:12,color:"var(--accent-warm)",fontWeight:600,marginBottom:6}}>✓ LER issued — learning & employment record created</div>
          <div style={{fontFamily:"var(--mono)",fontSize:13}}>Verify ID: {DEMO_NEW_CRED.verifyId}</div>
          <div style={{fontSize:11,color:"var(--text-3)",marginTop:6}}>Used in Enterprise talent search & ATS integration (demo).</div>
        </div>
      </div>
    )}
    <div className="pb"><div className="g2">
      {list.map((c,i) => (
        <div key={c.id} id={c.verifyId} className={"glass cred fade-up"+(c.verifyId===highlightId||c.isNew?" hl-demo":"")} style={{animationDelay:`${i*.06}s`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div><div style={{fontSize:15,fontWeight:600}}>{c.project}</div><div style={{fontSize:12,color:"var(--text-2)",marginTop:2}}>{c.task}</div></div>
            <span className={`badge ${c.qaPass?"b-gr":"b-rd"}`}>{c.qaPass?"QA passed":"Not passed"}</span>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:12}}>{c.skills.map(s=><span key={s} className="tag">{s}</span>)}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,margin:"12px 0"}}>

}

// ─── Portfolio ───
function Portfolio({user}) {
  const [tpl,setTpl] = useState("project");

function App() {
  const [role,setRole]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [selProj,setSelProj]=useState(null);
  const [flow,setFlow]=useState(0);
  const [tour,setTour]=useState(0);
  const user=role?MOCK_USERS[role]:null;

  const startFlow = () => { setRole("maker"); setPage("tasks"); setFlow(0); setTour(1); };
  const submitFlow = () => { setFlow(1); setTour(3); };
  const approveFlow = () => {
    setFlow(2);
    setTour(5);
    setPage("credentials");
    setTimeout(() => {
      const el = document.getElementById(DEMO_NEW_CRED.verifyId);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 400);
  };
  const switchDemoRole = (r) => {
    setRole(r);
    if(r==="reviewer"&&flow>=1) setPage("review");
    else if(r==="maker") setPage(flow>=2?"credentials":"tasks");
    else setPage("dashboard");
  };
  const tourAction = (act) => {
    if(act==="tasks") { setPage("tasks"); setTour(2); }
    else if(act==="switchReviewer") { switchDemoRole("reviewer"); setTour(4); }
    else if(act==="review") { setPage("review"); setTour(4); }
    else if(act==="credentials") { setPage("credentials"); setTour(0); }
    else setTour(t=>t+1);
  };

  const navs={
    maker:[{items:[{id:"dashboard",name:"Dashboard",icon:I.home},{id:"tasks",name:"My tasks",icon:I.check,badge:2},{id:"credentials",name:"Credentials",icon:I.badge},{id:"portfolio",name:"Portfolio",icon:I.file}]}],
    reviewer:[{items:[{id:"dashboard",name:"Dashboard",icon:I.home},{id:"review",name:"Review queue",icon:I.check,badge:3},{id:"credentials",name:"Credentials",icon:I.badge}]}],
    client:[{items:[{id:"dashboard",name:"Dashboard",icon:I.home},{id:"projects",name:"Projects",icon:I.folder},{id:"talent",name:"Talent search",icon:I.search}]}],
    admin:[{label:"Operations",items:[{id:"dashboard",name:"Ops dashboard",icon:I.chart},{id:"projects",name:"Project admin",icon:I.folder},{id:"review",name:"Review queue",icon:I.badge}]},{label:"Admin",items:[{id:"users",name:"User admin",icon:I.users},{id:"talent",name:"Talent search",icon:I.search},{id:"credentials",name:"Credentials",icon:I.badge}]}],
  };

  const nav=id=>{setPage(id);setSelProj(null)};

  const renderPage=()=>{
    if(!user)return null;
    if(selProj)return <ProjectDetail project={selProj} onBack={()=>setSelProj(null)}/>;
    switch(page){
      case "dashboard": return role==="admin"?<AdminDash/>:role==="client"?<ClientDash user={user}/>:<MakerDash user={user}/>;
      case "projects": return <Projects onSelect={setSelProj}/>;
      case "tasks": return role==="maker" ? <MakerTasks user={user} flow={flow} onSubmit={submitFlow}/> : (<div><div className="ph"><h1>My tasks</h1><p>Manage assigned tasks</p></div><div className="pb"><div className="glass" style={{padding:20}}><table><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Level</th><th>Due</th></tr></thead><tbody>{(role==="admin"?MOCK_TASKS:MOCK_TASKS.filter(t=>t.assignee===user.name)).map(t=><tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td style={{fontSize:12,color:"var(--text-2)"}}>{MOCK_PROJECTS.find(p=>p.id===t.projectId)?.name}</td><td><StatusBadge s={taskStatusForDemo(t,flow)}/></td><td><span className={`badge ${t.difficulty==="Hard"?"b-rd":"b-or"}`}>{t.difficulty}</span></td><td style={{fontSize:12,color:"var(--text-2)"}}>{t.deadline}</td></tr>)}</tbody></table></div></div></div>);
      case "credentials": return <Creds flow={flow} highlightId={DEMO_NEW_CRED.verifyId}/>;
      case "portfolio": return <Portfolio user={user}/>;
      case "talent": return <TalentSearch/>;
      case "review": return <Review flow={flow} onApprove={approveFlow}/>;
      case "users": return (<div><div className="ph"><h1>User admin</h1></div><div className="pb"><div className="glass" style={{padding:20}}><table><thead><tr><th>Name</th><th>Grade</th><th>Trust</th><th>Done</th><th>On-time</th><th>Region</th></tr></thead><tbody>{MOCK_TALENTS.map(t=><tr key={t.id}><td style={{fontWeight:550}}>{t.name}</td><td><GradeBadge g={t.grade}/></td><td style={{fontFamily:"var(--mono)"}}>{t.trustScore}</td><td>{t.projects}</td><td>{t.deadlineRate}%</td><td>{t.region}</td></tr>)}</tbody></table></div></div></div>);
      default: return <MakerDash user={user}/>;
    }
  };

  if(!role)return(<><style>{css}</style><Login onLogin={r=>{setRole(r);setPage("dashboard");setTour(1);setFlow(0)}} onStartFlow={startFlow}/></>);

  return (<><style>{css}</style>
    <div className="app">
      <Side user={user} page={page} onNav={nav} onOut={()=>{setRole(null);setPage("dashboard");setFlow(0);setTour(0)}} items={navs[role]||navs.maker}/>
      <div className="main">
        <DemoBanner flow={flow} role={role} onSwitchRole={switchDemoRole} onGoTasks={()=>{setPage("tasks");setTour(2)}} onGoReview={()=>{switchDemoRole("reviewer")}} onGoCreds={()=>{setPage("credentials");setTour(0)}}/>
        {renderPage()}
      </div>
      <MobileNav page={page} onNav={nav} items={navs[role]||navs.maker} onOut={()=>{setRole(null);setPage("dashboard");setFlow(0);setTour(0)}}/>
      {tour>0&&<DemoTour step={tour} role={role} flow={flow} onNext={()=>setTour(s=>s+1)} onSkip={()=>setTour(0)} onAction={tourAction}/>}
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
