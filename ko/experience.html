const { useState, useEffect, useRef, useCallback } = React;

// ─── Mouse parallax hook ───
function useParallax() {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const ref = useRef(null);
  useEffect(() => {
    const handle = (e) => {
      const w = window.innerWidth, h = window.innerHeight;
      setPos({ x: (e.clientX - w / 2) / w, y: (e.clientY - h / 2) / h });
    };
    window.addEventListener("mousemove", handle);
    return () => window.removeEventListener("mousemove", handle);
  }, []);
  return pos;
}

// ─── Intersection observer for stagger ───
function useInView(threshold = 0.1) {
  const [visible, setVisible] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

// ─── Floating Glass Objects ───
function FloatingObj({ size, x, y, blur, opacity, color, speed, parallax, mouse }) {
  return (
    <div
      className="float-obj"
      style={{
        width: size, height: size,
        left: `${x}%`, top: `${y}%`,
        background: `radial-gradient(circle at 30% 30%, ${color} 0%, transparent 70%)`,
        filter: `blur(${blur}px)`,
        opacity,
        animationDuration: `${speed}s`,
        transform: `translate(${mouse.x * parallax}px, ${mouse.y * parallax}px)`,
      }}
    />
  );
}
